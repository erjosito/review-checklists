name: aprl-DiversePeeringLocationsDifferentPeeringLocation
title: Connect ExpressRoute gateway with circuits from diverse peering locations
description: For improved reliability, each ExpressRoute gateway should connect to at least two circuits,
  with each circuit sourced from a different peering location. This setup ensures diverse connectivity
  paths, enhancing resilience and minimizing service disruption risks.
