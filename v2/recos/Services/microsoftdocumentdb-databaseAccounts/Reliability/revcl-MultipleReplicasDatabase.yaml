description: Azure Cosmos DB automatically maintains multiple data replicas and handles replica outages
  through quorum; customers do not set a generic database replica count greater than one. Configure supported
  zone redundancy and account regions according to workload requirements, and test client retry and recovery
  behavior for the chosen topology.
