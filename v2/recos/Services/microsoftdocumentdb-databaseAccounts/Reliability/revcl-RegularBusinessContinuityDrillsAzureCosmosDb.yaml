name: revcl-RegularBusinessContinuityDrillsAzureCosmosDb
title: Configure Cosmos DB failover and rehearse client recovery for the selected account topology
description: For single-write accounts with multiple regions, configure service-managed failover where
  appropriate and define preferred regions, failover priorities and recovery procedures. Current service
  guidance warns that account-wide service-managed failover can take an hour or more; it is not a zero-downtime
  guarantee. Consider documented per-partition automatic failover applicability separately. Verify SDK
  retries, consistency, surviving-region throughput and potential unreplicated data loss during authorized
  continuity drills.
