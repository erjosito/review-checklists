description: Zone redundancy is configured per account region, not as a single account-wide switch. Enable
  it where supported, especially for single-region accounts and single-write/multiple-read-region accounts.
  The service distributes replicas across zones. Serverless accounts require zone redundancy at creation;
  existing serverless accounts cannot be converted. Zone redundancy does not replace a multiregion strategy
  for region-wide loss.
