name: revcl-AzureCosmosDbRegularIntervals
title: Verify Cosmos DB backup mode and recoverability rather than assuming automatic backups are sufficient
description: Review whether periodic or continuous backup meets the workload's recovery and retention
  requirements. Automatic backup creation is not a recovery test and does not protect every account configuration
  or region by itself. Document restore permissions, available restore points, target region, excluded
  configuration and a tested process for restoring application access.
