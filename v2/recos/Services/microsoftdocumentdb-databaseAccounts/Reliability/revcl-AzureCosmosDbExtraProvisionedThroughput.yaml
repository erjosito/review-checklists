name: revcl-AzureCosmosDbExtraProvisionedThroughput
title: Configure and test Cosmos DB continuous point-in-time recovery
description: 'Select a supported continuous-backup tier and retention window for business recovery needs;
  current documentation lists 7, 30 and 35 days. Verify API support, the latest restorable timestamp and
  the available backup region before restoration. Backups run without consuming additional provisioned
  RUs, but backups are not automatically geo-disaster resistant: add a region explicitly where needed.
  Recreate excluded networking, private endpoints, RBAC and other account configuration after restore
  and test recovery against RTO/RPO. Restore target options depend on the scenario; do not assume every
  restore supports an existing account.'
