name: revcl-LeverageMultiRegionWritesMultiRegionWritesCapability
title: Evaluate Cosmos DB multiregion writes with consistency and conflict-resolution requirements
description: Use multiple write regions when the workload requires regional write availability and can
  support the consistency and conflict-resolution model. Configure supported SDK routing and sufficient
  capacity in surviving regions. Evaluate replication lag, conflicts and recovery behavior rather than
  assuming writes in several regions guarantee zero data loss or uninterrupted availability. Avoid bounded
  staleness as a multiregion-write default; the Advisor catalog calls out its coordination overhead.
