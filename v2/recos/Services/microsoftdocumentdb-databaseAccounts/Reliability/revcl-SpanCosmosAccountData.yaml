name: revcl-SpanCosmosAccountData
title: Use multiple Cosmos DB account regions when regional resilience is required
description: For production workloads needing resilience to regional loss, use at least two supported
  account regions and budget for additional capacity. Decide separately between a single write region
  with failover and multiple write regions. Configure client routing, consistency and sufficient remaining-region
  capacity; regional replication alone is not evidence that the full application meets recovery targets.
