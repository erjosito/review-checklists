name: aprl-SingletonPatternSingleInstance
title: Maintain singleton pattern in your client
description: Using a single instance of the SDK client for each account and application is crucial as
  connections are tied to the client. Compute environments have a limit on open connections, affecting
  connectivity when exceeded.
