name: aprl-MultiRegionWriteCapabilityMultipleRegions
title: Evaluate multi-region write capability
description: Multi-region writes enable high availability but require careful consistency and conflict
  resolution. Using Bounded Staleness is an anti-pattern, as replication lag increases latency and coordination
  overhead. This setup undermines scalability, impacting performance and availability.
