description: Key Vault replicates contents within its region and synchronously across availability zones
  where supported. Cross-region replication is asynchronous and depends on a supported paired region in
  the same geography; it is not universal. Check regional exceptions and accept potential unreplicated
  changes during regional loss. Do not use an assumed fixed geographic distance as recovery assurance.
