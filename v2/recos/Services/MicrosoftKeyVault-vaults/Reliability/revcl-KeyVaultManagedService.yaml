description: Key Vault automatically handles availability-zone failures in supported regions. Microsoft-managed
  cross-region replication and failover are available only for supported paired regions and are best effort,
  potentially delayed by hours. Brazil South, Brazil Southeast, West US 3 and nonpaired regions do not
  support this managed cross-region behavior. Where this cannot meet the workload RTO/RPO, design separate
  regional vaults, maintain recoverable objects and implement application failover.
