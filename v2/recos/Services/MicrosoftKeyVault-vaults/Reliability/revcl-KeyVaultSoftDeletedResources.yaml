description: The default retention is 90 days, but the configured interval can be 7 to 90 days and cannot
  be changed after vault creation. The same interval applies to purge protection. Soft delete is enabled
  by default for new vaults and cannot be disabled once enabled. Recovery of a deleted vault does not
  restore associated RBAC role assignments or Event Grid subscriptions; include recreating these dependencies
  in recovery procedures.
