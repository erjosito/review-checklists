description: For supported paired regions, Microsoft-managed failover can be delayed and is best effort.
  After failover, the vault supports only documented read and cryptographic operations; access policies,
  firewall rules and vault properties cannot be changed in the secondary region. Include these restrictions
  and client retries in the recovery plan. Use a custom multiregion design if business recovery targets
  cannot tolerate this behavior.
