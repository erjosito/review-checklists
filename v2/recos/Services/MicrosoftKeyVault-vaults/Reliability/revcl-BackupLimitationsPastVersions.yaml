description: Key Vault backup is limited to no more than 500 past versions of an individual key, secret
  or certificate. Plan object lifecycle and backup operations within this limit, monitor backup failures,
  and verify that recovery copies can be restored in the permitted subscription and geography. A backup
  file is a point-in-time copy, not proof that current secrets are protected.
