description: Separate routine secret, key and certificate use from destructive administration. Azure RBAC
  roles for Key Vault are distinct from Microsoft Entra directory roles. Key Vault Purge Operator permits
  purging soft-deleted vaults; evaluate object-level purge data actions separately rather than assuming
  this role covers every object. Use least-privilege built-in or justified custom roles, auditable privileged
  activation, and purge protection so authorized deletion cannot bypass the retention period.
