description: Assign ownership and lifetimes to credentials, use native rotation capabilities where available,
  and automate the remaining rotation workflow. Coordinate secret producers and consumers so replacement
  credentials are available before old ones are retired. Test renewal, propagation, rollback and emergency
  revocation without logging secret values. A secret-store reference or refresh mechanism does not itself
  rotate the source credential.
