description: Configure certificate lifetime actions and renewal for the supported integrated certificate
  authorities, DigiCert and GlobalSign. For certificates issued by nonintegrated authorities, configure
  expiry notifications and an external or manual issuance/import workflow that creates the replacement
  certificate version. Verify that dependent services retrieve and use the renewed version; storing a
  certificate in Key Vault alone does not automate every issuer or consumer.
