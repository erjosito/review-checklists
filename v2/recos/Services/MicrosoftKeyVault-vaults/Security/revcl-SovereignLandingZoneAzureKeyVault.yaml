description: Choose the key-management service according to sovereignty, isolation and cryptographic requirements.
  Managed HSM safeguards cryptographic keys and uses its own local RBAC model; it is not the general store
  for passwords, connection strings or arbitrary credentials. Store application secrets and certificates
  in the appropriate Key Vault object types, enforce least privilege, and verify that dependent services
  support the chosen key store.
