description: Separate control-plane vault provisioning from data-plane access to keys, secrets and certificates.
  Delegate only the roles and scope required by each team, use eligible just-in-time privileged roles
  through Microsoft Entra Privileged Identity Management where applicable, and audit or enforce the required
  vault configuration with Azure Policy. A configuration policy does not replace authorization review.
