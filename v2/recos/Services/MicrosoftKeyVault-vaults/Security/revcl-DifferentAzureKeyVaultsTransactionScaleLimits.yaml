description: 'Treat vaults as security boundaries and grant application identities access only to the
  secrets they need. Review application ownership, environments, regional dependencies and expected request
  volume when choosing boundaries. A count of vaults per subscription cannot establish correct isolation
  or capacity: zero or multiple vaults is not automatically compliant. Verify the design and effective
  permissions against the workload inventory.'
