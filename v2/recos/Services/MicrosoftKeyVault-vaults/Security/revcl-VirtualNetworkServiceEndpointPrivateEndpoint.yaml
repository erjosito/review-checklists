description: Prefer private endpoints with public network access disabled where the workload can support
  that model. Otherwise constrain firewall and virtual-network access to approved callers, review any
  trusted-service bypass, and consider Network Security Perimeter where applicable. Network isolation
  does not replace authentication or data-plane authorization. Test DNS resolution and authorized application
  paths without assuming that a resolvable public DNS name means the data plane is publicly accessible.
