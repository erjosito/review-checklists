description: Create diagnostic settings that collect Key Vault AuditEvent resource logs. Route them to
  the designated Log Analytics workspace, including the platform-central workspace when required by the
  organization, or another supported audit destination. Verify ingestion, retention and access controls.
  Automatically collected platform metrics and the subscription Activity Log do not replace data-plane
  usage audit logs.
