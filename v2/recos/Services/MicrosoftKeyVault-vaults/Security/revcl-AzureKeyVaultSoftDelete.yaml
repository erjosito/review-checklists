description: Soft delete and purge protection are separate safeguards. Soft delete is enabled by default
  for new vaults and cannot be disabled after enablement; purge protection must be enabled explicitly.
  Select the 7-90 day retention period at creation because it cannot subsequently be changed. Restrict
  deletion and purge permissions, and test recovery of the vault, objects, role assignments and dependent
  integrations. Recovering a vault does not restore deleted role assignments or Event Grid subscriptions.
