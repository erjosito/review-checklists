name: aprl-SoftDeleteKeyVault
title: Verify Key Vault soft delete and choose the required recovery retention
description: Keep Key Vault soft delete enabled and choose a recovery period that meets the recovery policy.
  The configurable period is 7-90 days, with 90 days as the default, rather than an invariant 90-day retention.
  Rehearse recovery and recreate associated RBAC assignments and Event Grid subscriptions when needed,
  because vault recovery does not restore those deleted integrations automatically. Purge protection is
  a separate control against early permanent deletion.
