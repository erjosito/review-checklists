name: aprl-KeyVaultCertificateVersionNewCertificateVersions
title: Use latest version for customer-managed certificates
description: If you use your own TLS certificates, set the Key Vault certificate version to 'Latest' to
  avoid reconfiguring Azure Front Door for new certificate versions and waiting for deployment across
  Front Door's environments.
