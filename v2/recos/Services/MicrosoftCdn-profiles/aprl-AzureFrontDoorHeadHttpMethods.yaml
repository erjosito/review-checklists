name: aprl-AzureFrontDoorHeadHttpMethods
title: Use HEAD health probes
description: Health probes in Azure Front Door can use GET or HEAD HTTP methods. Using the HEAD method
  for health probes is a recommended practice because it reduces the traffic load on your origins, being
  less resource-intensive.
