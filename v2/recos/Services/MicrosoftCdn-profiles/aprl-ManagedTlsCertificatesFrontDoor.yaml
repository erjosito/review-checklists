name: aprl-ManagedTlsCertificatesFrontDoor
title: Use managed TLS certificates
description: When Front Door manages your TLS certificates, it reduces your operational costs and helps
  you to avoid costly outages caused by forgetting to renew a certificate. Front Door automatically issues
  and rotates the managed TLS certificates.
