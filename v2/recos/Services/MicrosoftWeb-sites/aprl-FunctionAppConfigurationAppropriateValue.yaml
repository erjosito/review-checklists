name: aprl-FunctionAppConfigurationAppropriateValue
title: Ensure FUNCTIONS_WORKER_RUNTIME is set properly
description: The FUNCTIONS_WORKER_RUNTIME setting in the Function App configuration should be set to the
  appropriate value based on the language you are using. This setting is used to determine the language
  worker that will be used to execute your functions.
