name: wafsg-AdequatePerformanceTestingScalingStrategy
title: Test App Service scaling rules and initialization headroom
description: Use a supported autoscaling mode for the plan and workload, set appropriate bounds, and account
  for application initialization and dependency capacity. Rules-based autoscaling and simpler automatic
  scaling have different configuration models; verify tier support. Load test bursts and scale-in against
  response-time and throughput targets.
