name: wafsg-SingleAppServicePlanAppServiceApps
title: Evaluate Always On for App Service workloads sensitive to cold starts
description: Enable Always On on a supported plan when unloading idle applications would violate startup
  or request-latency requirements. The concern is not limited to multiple apps sharing a plan. Validate
  initialization, dependencies and observed behavior; Always On does not guarantee that every request
  meets its latency target.
