name: wafsg-PerformanceIndicatorsKeyIndicators
title: Define and monitor numerical App Service performance targets
description: Record workload-driven targets for request throughput, latency percentiles, errors and queueing,
  and correlate App Service metrics with application traces and profiling. Establish a repeatable baseline
  and compare over time. An average response time or resource inventory alone can hide tail latency and
  does not establish that all user flows meet their targets.
