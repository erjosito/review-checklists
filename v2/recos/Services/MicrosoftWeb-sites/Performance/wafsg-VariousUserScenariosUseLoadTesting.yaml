name: wafsg-VariousUserScenariosUseLoadTesting
title: Load test App Service capacity with explicit acceptance and stop criteria
description: Exercise realistic user flows and data in a production-like environment and compare normal,
  peak and sustained-load results with workload targets. Configure request-scoped response-time percentiles,
  throughput and error thresholds in Azure Load Testing where appropriate. Auto-stop protects against
  harmful or wasteful runs and is separate from test acceptance. Server-side failure criteria require
  metric access and currently cannot be configured through Azure Pipelines/GitHub Actions. Keep baseline
  comparisons and results; an ARG resource list is not a load test.
