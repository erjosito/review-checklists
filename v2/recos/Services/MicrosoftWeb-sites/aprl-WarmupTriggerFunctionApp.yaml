name: aprl-WarmupTriggerFunctionApp
title: Use a Functions warmup trigger on supported plans for scale-out startup
description: On a supported hosting plan, use a warmup trigger to preload shared custom dependencies when
  new function-app instances are added during scale-out. Warmup is not available on the Consumption plan
  and is not invoked for restarts or other non-scaling starts. Do not make correctness depend on warmup
  execution; retain lazy initialization or another safe initialization path. Use at most one warmup function
  per app and observe the documented authentication and runtime restrictions.
