name: wafsg-AzureLoadTestingAutomatedTests
title: Gate App Service releases on workload-specific automated test evidence
description: Define a workload-specific test strategy and a release test plan aligned with business objectives.
  Test functionality, integration and performance before promotion, with explicit entry and exit criteria.
  Include end-to-end checks across application and infrastructure, keep pipeline feedback timely, and
  run production experiments only with isolation, monitoring and stop/recovery safeguards. Tool installation
  or resource presence is not evidence that these tests passed.
