name: wafsg-AppServiceResourceProviderCertificationManagement
title: Use eligible App Service managed certificates or explicitly operate imported certificates
description: For eligible App Service custom domains, create and bind a free App Service managed certificate
  and keep DNS and reachability prerequisites valid for renewal. Free managed certificates do not support
  wildcard certificates or private DNS and are not exportable. Importing a certificate from Key Vault
  is a separate option requiring the App Service resource provider's access and an operated renewal/synchronization
  process. Verify the chosen option and TLS binding rather than conflating the two lifecycles.
