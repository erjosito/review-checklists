name: wafsg-SameVirtualMachineDeploymentSlots
title: 'Manage releases: Use deployment slots to manage releases effectively. You can deploy your application
  to a slot, perform testing, and validate its functionality. After verification, you can seamlessly move
  the app to production. This process doesn''t incur extra costs because the slot runs in the same virtual
  machine (VM) environment as the production instance.'
description: Use deployment slots on a supported App Service plan tier to validate releases before a controlled
  swap. Slots have no separate slot fee but consume the plan's shared capacity, so size and isolate preproduction
  activity to avoid affecting production. Review slot-specific settings, identity and network configuration,
  and rehearse application and data recovery. A slot swap is not an independent environment boundary or
  a guarantee of zero application downtime.
