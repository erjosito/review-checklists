name: wafsg-AppServicePlanAppChanges
title: (App Service plan) Validate app changes in the staging slot before you swap it with the production
  slot.
description: On App Service tiers that support deployment slots, validate the staging app, warm-up behavior,
  slot-specific settings, identities and network dependencies before swapping into production. Use production
  as the target and monitor health after the swap. Rehearse swap-back or roll-forward, including compatible
  database changes; swapping code cannot undo external data changes or guarantee that every application
  request succeeds.
