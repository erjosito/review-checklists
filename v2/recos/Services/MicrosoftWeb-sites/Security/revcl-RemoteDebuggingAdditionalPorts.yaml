name: revcl-RemoteDebuggingAdditionalPorts
title: Disable remote debugging for production App Service applications.
description: Confirm remote debugging is disabled on the production app and relevant slots. Although App
  Service automatically turns it off after 48 hours, that timeout is not a substitute for production hardening.
  Review operational access and troubleshooting alternatives. The inherited ARG property/table representation
  was not verified; use explicit configuration review until supported query evidence is established.
