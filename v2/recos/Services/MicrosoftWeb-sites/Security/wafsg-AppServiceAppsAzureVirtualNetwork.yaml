name: wafsg-AppServiceAppsAzureVirtualNetwork
title: Segment App Service identities and network paths with controls appropriate to the hosting model.
description: Assign least-privilege identities and choose isolation boundaries for apps and plans according
  to the data and trust boundaries. For multitenant App Service, virtual network integration controls
  outbound connectivity; it is not equivalent to injecting the application into a subnet or isolating
  inbound access. Use private endpoints or other supported inbound restrictions, configure the outbound
  routing explicitly, and verify allowed flows. Consider App Service Environment when dedicated compute
  and network isolation are required.
