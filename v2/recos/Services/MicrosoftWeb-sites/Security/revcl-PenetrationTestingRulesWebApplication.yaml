name: revcl-PenetrationTestingRulesWebApplication
title: Perform authorized, risk-driven security testing of the App Service application and its controls.
description: Agree the scope and rules of engagement with the workload owner and security team. Use the
  current threat model and critical flows to prioritize penetration testing and other security tests;
  test identity, network and application controls and the ability to detect attacks. Protect test credentials,
  evidence and synthetic data, schedule recurring and change-triggered tests, track remediation and retest
  fixes. A single penetration test or vulnerability scan is not proof of complete security.
