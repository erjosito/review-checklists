name: wafsg-MicrosoftEntraIdBasedAuthenticationSecureDeploymentMethod
title: Harden App Service deployment access, debugging, protocols and browser cross-origin settings.
description: Disable FTP and SCM basic publishing authentication where supported and use Microsoft Entra-based
  deployment methods. Disable remote debugging in production and protocols that the workload does not
  need. Restrict CORS to intended browser origins, but enforce authentication and authorization independently
  because CORS is not a security boundary for arbitrary clients. Test deployment and application paths
  after changing controls and use policy to detect configuration drift.
