name: revcl-AppServiceKeyVaultReferencesAzureKeyVault
title: Use Key Vault to store secrets
description: Use Azure Key Vault to store any secrets the application needs.  Key Vault provides a safe
  and audited environment for storing secrets and is well-integrated with App Service through the Key
  Vault SDK or App Service Key Vault References.
