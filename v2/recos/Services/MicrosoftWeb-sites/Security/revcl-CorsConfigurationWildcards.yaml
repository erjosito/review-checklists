name: revcl-CorsConfigurationWildcards
title: Restrict browser CORS origins and enforce authentication and authorization separately.
description: Allow only the specific browser origins needed by the application rather than a wildcard.
  CORS governs browser cross-origin behavior; it is not a network perimeter or an access-control boundary
  for nonbrowser clients. Verify server-side identity and authorization checks independently, and test
  the intended cross-origin flows.
