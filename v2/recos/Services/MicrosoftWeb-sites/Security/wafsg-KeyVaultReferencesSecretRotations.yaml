name: wafsg-KeyVaultReferencesSecretRotations
title: Use Key Vault references for App Service secrets and plan how rotated values reach consumers.
description: Prefer managed identities to avoid secrets where possible. For remaining secret-valued app
  settings, authorize the app's identity to read the required vault secrets and ensure network reachability.
  Versionless references pick up newer secret versions within 24 hours because App Service caches values;
  version-pinned references do not automatically follow the latest version. A configuration change or
  the documented refresh operation can force retrieval. The source credential must be rotated separately
  and consumer behavior tested. Do not store ordinary nonsecret configuration in Key Vault, and isolate
  environment-specific references with appropriate slot settings.
