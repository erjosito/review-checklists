name: wafsg-TransportLayerSecurityAppService
title: Secure App Service custom domains with valid certificates and enforce HTTPS.
description: Configure certificate bindings for the intended hostnames and enable HTTPS Only to redirect
  HTTP requests to HTTPS. Test trust, hostname matching, expiration and renewal; the portal's Secured
  label alone does not verify these properties. HTTPS Only is a redirect control, not evidence that the
  shared HTTP port is closed. Validate minimum TLS requirements and any proxy-to-origin encryption separately.
