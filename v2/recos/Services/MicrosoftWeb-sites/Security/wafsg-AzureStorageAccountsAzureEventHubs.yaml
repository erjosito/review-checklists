name: wafsg-AzureStorageAccountsAzureEventHubs
title: (App Service plan) Enable diagnostic logging and add instrumentation to your app. The logs are
  sent to Azure Storage accounts, Azure Event Hubs, and Log Analytics. For more information about audit
  log types, see Supported log types.
description: Logging captures access patterns. It records relevant events that provide valuable insights
  into how users interact with an application or platform. This information is crucial for accountability,
  compliance, and security purposes.
