name: wafsg-VirtualNetworkIntegrationAzureVirtualNetwork
title: Configure App Service inbound private access and outbound virtual-network routing explicitly.
description: Use private endpoints and restrict public access when the application should be reached only
  through approved private paths or a reverse proxy. Configure virtual network integration for outbound
  connectivity, and explicitly route application traffic and container-image pulls through the intended
  network. Verify DNS, identity permissions, firewall rules and required platform dependencies. Enabling
  virtual network integration alone is not proof that every outbound or inbound path is private.
