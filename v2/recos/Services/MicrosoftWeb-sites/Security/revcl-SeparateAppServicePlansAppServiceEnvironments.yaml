name: revcl-SeparateAppServicePlansAppServiceEnvironments
title: Isolate systems that process sensitive information
description: Systems that process sensitive information should be isolated.  To do so, use separate App
  Service Plans or App Service Environments and consider the use of different subscriptions or management
  groups.
