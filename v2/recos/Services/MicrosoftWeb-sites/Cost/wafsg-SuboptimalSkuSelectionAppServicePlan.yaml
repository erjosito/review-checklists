name: wafsg-SuboptimalSkuSelectionAppServicePlan
title: Rightsize App Service plans using usage and feature requirements
description: Review Advisor plan sizing suggestions together with CPU, memory, request performance, scaling
  and required tier features. Include all apps/slots sharing a plan, isolation needs and current commitment
  discounts. Validate changes under peak load rather than assuming low CPU alone supports a smaller plan.
