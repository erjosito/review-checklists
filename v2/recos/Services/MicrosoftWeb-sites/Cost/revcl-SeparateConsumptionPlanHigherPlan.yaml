description: Compare per-function/group scaling, concurrency, memory, minimum capacity and feature constraints
  of the applicable hosting options. Separate a dominant workload only when tests show a net benefit;
  do not automatically move workloads to a legacy Consumption plan or a higher tier solely because they
  are CPU intensive.
