name: aprl-AzureFunctionsRuntimeFunctionApp
title: Ensure Function App runs a supported version
description: Beginning on December 13, 2022, function apps running on versions 2.x and 3.x of the Azure
  Functions runtime have reached the end of life (EOL) of extended support. We highly recommend you migrating
  your function apps to version 4.x of the Functions runtime.
