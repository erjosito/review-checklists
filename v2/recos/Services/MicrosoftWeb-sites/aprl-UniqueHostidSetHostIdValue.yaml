name: aprl-UniqueHostidSetHostIdValue
title: Ensure unique hostid set for Function App
description: A host ID must be between 1 and 32 characters, contain only lowercase letters, numbers, and
  dashes, not start or end with a dash, and not contain consecutive dashes. The host ID value should be
  unique for all apps/slots you're running.
