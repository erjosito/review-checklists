name: aprl-SeparateAppServiceAppsWebFrontEnd
title: Separate web apps from web APIs
description: If your solution includes both a web front end and a web API, decomposing them into separate
  App Service apps facilitates solution decomposition by workload, allowing for independent scaling. Initially,
  you can deploy both in the same plan and separate them for independent scaling when necessary.
