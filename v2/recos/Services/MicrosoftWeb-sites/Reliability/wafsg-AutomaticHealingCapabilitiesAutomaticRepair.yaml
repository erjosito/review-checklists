name: wafsg-AutomaticHealingCapabilitiesAutomaticRepair
title: Design App Service recovery with redundancy, self-healing and graceful degradation
description: Use multiple instances and supported auto-heal capabilities, and design application behavior
  for failed dependencies. Apply appropriate retry, circuit-breaker, bulkhead and queue-based load-leveling
  patterns to contain failures and maintain useful service. Test recovery and degraded modes against targets
  rather than relying on automatic repair alone.
