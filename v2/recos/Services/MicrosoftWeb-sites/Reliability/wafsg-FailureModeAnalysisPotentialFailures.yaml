name: wafsg-FailureModeAnalysisPotentialFailures
title: Perform failure mode analysis for App Service and its dependencies
description: Identify failure points in hosting instances, external services, networking and storage,
  and document detection and mitigation for each critical flow. Include timeouts, retries and circuit
  breakers for dependencies, component redundancy and health-based routing. Keep the analysis current
  as deployment topology and dependencies change.
