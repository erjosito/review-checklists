name: wafsg-AutomatedRecoveryOperationsConductReliabilityTesting
title: Test App Service load, fault tolerance and automated recovery against defined targets
description: Run load and controlled fault-injection scenarios to verify scaling, self-healing, dependency
  failure handling and recovery within agreed targets. Include plan resource limits and realistic warm-up
  behavior. Define safety boundaries and collect results to improve the design; configuration inventory
  is not evidence that these tests passed.
