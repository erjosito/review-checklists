name: wafsg-AppServicePlanZoneRedundancy
title: Enable App Service plan zone redundancy and size for surviving-zone capacity
description: Enable zone redundancy on a supported Premium v2-v4 plan and scale unit in a supported region,
  with at least two instances. Confirm Premium v4 regional availability separately. Consider additional
  instances based on the capacity required after losing a zone; the platform only attempts best-effort
  replacement capacity. All apps sharing the plan inherit its zone configuration, but dependencies need
  their own resilience design.
