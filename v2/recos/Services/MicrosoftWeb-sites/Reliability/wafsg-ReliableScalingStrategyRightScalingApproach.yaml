name: wafsg-ReliableScalingStrategyRightScalingApproach
title: Test a timely App Service scaling strategy with capacity headroom
description: Choose scale-out and supported autoscaling based on observed or predicted demand and plan
  limits; retain headroom while new instances initialize. Externalize state where needed so multiple instances
  work correctly. Test scaling rules with realistic load, log scaling events and verify recovery under
  resource limits. A configured rule alone does not demonstrate successful scaling.
