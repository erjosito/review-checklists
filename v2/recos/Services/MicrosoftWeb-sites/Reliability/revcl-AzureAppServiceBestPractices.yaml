description: 'Maintain a tested recovery procedure for the web application, configuration and dependencies.
  Do not use App Service linked-database backup functionality: it is deprecated. Use each database service''s
  native backup and restore tooling instead, and coordinate restoration with the app''s recovery plan
  and RTO/RPO. Confirm supported app backup scope and reconstruct omitted dependencies.'
