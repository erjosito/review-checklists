      Web endpoint scope does not establish complete system monitoring.
description: Use Application Insights availability tests from multiple locations to detect endpoint unavailability
  and slow responses. Configure actionable alerts and interpret synthetic results alongside application/dependency
  telemetry and critical-flow SLIs over defined measurement windows. Retain and make telemetry accessible
  for detection, response and post-incident analysis. A passing endpoint test alone does not establish
  availability of all business flows or prove the workload SLO.
