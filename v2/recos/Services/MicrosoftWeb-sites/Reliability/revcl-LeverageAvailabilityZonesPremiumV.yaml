description: Premium v2 through v4 plans support zone redundancy subject to regional and scale-unit support.
  For Premium v4, confirm both v4 availability and zone support in the target region. Use at least two
  instances and verify that the plan's scale unit supports zones; unsupported scale units require redeployment.
  Plan spare capacity for zone loss because replacement capacity is best effort.
