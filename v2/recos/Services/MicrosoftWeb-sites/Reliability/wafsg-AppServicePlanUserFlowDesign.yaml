name: wafsg-AppServicePlanUserFlowDesign
title: Prioritize App Service user and system flows by business criticality
description: Identify critical user journeys and supporting system flows and rate them with business stakeholders.
  Use that ranking to choose App Service tiers, instance counts, dependency resilience and recovery/testing
  priorities. Avoid treating every flow as equally critical or assuming an app-wide endpoint check measures
  every flow.
