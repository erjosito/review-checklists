name: aprl-ServiceBusNamespacesUseServiceBus
title: Verify Service Bus availability-zone support in a supported region
description: Service Bus supports availability zones in Basic, Standard, and Premium tiers. Namespaces
  in regions with availability zones are zone redundant automatically, with no extra zone configuration
  or charge. The deprecated zoneRedundant property can be false even when zone redundancy is enabled;
  do not use it to report missing zone protection or require a Premium upgrade. Verify region support
  and application retry behavior separately from cross-region recovery requirements.
