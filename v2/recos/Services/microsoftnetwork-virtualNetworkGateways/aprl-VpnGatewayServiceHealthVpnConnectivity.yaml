name: aprl-VpnGatewayServiceHealthVpnConnectivity
title: Enable VPN gateway service health
description: VPN gateway leverages service health to inform users about both planned and unplanned maintenance,
  ensuring they are notified about modifications to their VPN connectivity. Mission Critical workloads
  should use dual ExpressRoutes instead of VPN.
