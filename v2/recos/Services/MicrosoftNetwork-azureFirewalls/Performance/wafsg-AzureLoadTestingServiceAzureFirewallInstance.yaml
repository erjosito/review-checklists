name: wafsg-AzureLoadTestingServiceAzureFirewallInstance
title: Warm up Azure Firewall and verify observed capacity before steady-state load tests
description: Generate separate warm-up traffic before steady-state measurements; the service guide recommends
  starting it 20 minutes before a test. Record scale events and observed capacity rather than assuming
  elapsed time guarantees maximum instances. Test cold-start and burst scaling separately. Where supported,
  evaluate prescaling for predictable demand and confirm eligibility and cost.
