name: wafsg-TheAzureFirewallSubnetNameEnoughIpAddresses
title: Reserve at least a /26 AzureFirewallSubnet for Azure Firewall scaling
description: Use the required AzureFirewallSubnet name and reserve enough usable addresses for the deployment
  and scaling. The service guide recommends /26; this is a sizing baseline, not an instruction to shrink
  a larger existing subnet. Review current deployment and any management-subnet requirements before changes.
