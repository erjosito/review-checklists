name: wafsg-DiagnosticToolsLogging
title: Limit expensive Azure Firewall diagnostics without removing required observability
description: Retain security, operational and audit logging required by the workload. Enable high-overhead
  troubleshooting features only for an explicit purpose and duration, measure their performance effect,
  and disable them when the investigation ends. Do not interpret performance tuning as a blanket instruction
  to disable diagnostics.
