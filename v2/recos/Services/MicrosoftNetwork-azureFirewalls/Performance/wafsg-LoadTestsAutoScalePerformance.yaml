name: wafsg-LoadTestsAutoScalePerformance
title: Test Azure Firewall scaling under representative steady and burst traffic
description: Measure throughput, latency, connection/SNAT demand and packet loss against targets with
  realistic rules, inspection modes and destination patterns. Separate warmed steady-state measurements
  from burst and scale-response experiments. Capture scale events and retain results; do not assume an
  inventory of firewall resources demonstrates performance.
