name: wafsg-SnatPortRequirements
title: Plan Azure Firewall public IP capacity from measured SNAT demand
description: Estimate concurrent flows by destination IP, port and protocol, then validate using firewall
  telemetry and load tests. Review whether additional public IPs or a supported egress design is required.
  Reserve headroom for growth; a count of public IPs alone is not proof against SNAT exhaustion.
