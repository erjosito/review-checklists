name: wafsg-BackendVirtualMachineScaleSetInstanceTwoVirtualMachineScaleSetInstances
title: Assess Azure Firewall SNAT capacity for the actual connection pattern
description: 'Review concurrent outbound connections, destination concentration, public IPs and observed
  scaling. The service guide describes 2,496 SNAT ports per public IP per backend instance and recommends
  additional public IPs for susceptible deployments. Treat these figures as planning inputs: confirm current
  SKU/service behavior and monitor exhaustion under representative load. Do not infer available capacity
  from a presumed backend instance maximum.'
