name: aprl-SingleAvailabilityZoneMultipleAvailabilityZones
title: Deploy Azure Firewall across multiple availability zones
description: Azure Firewall offers different SLAs depending on its deployment; in a single availability
  zone or across multiple, potentially improving reliability and performance.
source:
  type: aprl
  file: azure-resources/Network/azureFirewalls/recommendations.yaml
  timestamp: July 24, 2024
