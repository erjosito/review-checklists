name: aprl-TwoToFourPublicIpAddressesSnatPortUtilization
title: Configure 2-4 PIPs for SNAT Port utilization
description: Configure a minimum of two to four public IP addresses per Azure Firewall to avoid SNAT exhaustion.
  Azure Firewall offers SNAT for all outbound traffic to public IPs, providing 2,496 SNAT ports for each
  additional PIP.
