name: wafsg-AzureFirewallPortalExperienceAzureFirewallMonitoringWorkbook
title: Use the built-in Azure Firewall Monitoring Workbook.
description: Azure Firewall portal experience now includes a new workbook under the Monitoring section
  UI, a separate installation is no more required. With the Azure Firewall Workbook, you can extract valuable
  insights from Azure Firewall events, delve into your application and network rules, and examine statistics
  regarding firewall activities across URLs, ports, and addresses.
