name: wafsg-ExternalLogicAppAzurePolicyArtifacts
title: Maintain recoverable backups of Azure Firewall configuration and Firewall Policy
description: Keep Azure Firewall configuration, Firewall Policy and dependencies under version control
  with a recoverable backup. Prefer maintained IaC artifacts; otherwise use a documented export/backup
  process and test restoration. This control concerns Azure Firewall policies, not merely Azure Policy
  governance definitions.
