name: aprl-FlexOrchestrationModeFlexibleOrchestrationMode
title: Deploy VMSS with Flex orchestration mode instead of Uniform
description: Deploying even single instance VMs into a scale set with Flexible orchestration mode future-proofs
  applications for scaling and availability. This mode guarantees high availability (up to 1000 VMs) by
  distributing VMs across fault domains in a region or within an Availability Zone.
