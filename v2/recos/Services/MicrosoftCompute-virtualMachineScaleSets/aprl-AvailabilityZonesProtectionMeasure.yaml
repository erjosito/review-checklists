name: aprl-AvailabilityZonesProtectionMeasure
title: Deploy VMSS across availability zones with VMSS Flex
description: When creating VMSS, implement availability zones as a protection measure for your applications
  and data against the rare event of datacenter failure.
source:
  type: aprl
  file: azure-resources/Compute/virtualMachineScaleSets/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
