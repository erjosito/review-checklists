name: aprl-ApplicationLoadDemandsVmInstanceDistribution
title: Disable Force strictly even balance across zones to avoid scale in and out fail attempts
description: Microsoft advises disabling strictly even VM instance distribution across Availability Zones
  in VMSS to improve scalability and flexibility, noting that uneven distribution may better serve application
  load demands despite the potential trade-off in resilience.
source:
