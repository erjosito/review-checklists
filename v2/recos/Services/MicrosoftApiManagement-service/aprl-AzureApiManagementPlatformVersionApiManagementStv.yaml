name: aprl-AzureApiManagementPlatformVersionApiManagementStv
title: Use a supported API Management platform and migrate remaining stv1 instances
description: The classic API Management stv1 platform retirement date was August 31, 2024 in the global
  cloud and February 24, 2025 in Azure Government and China. Identify and migrate any remaining affected
  Developer, Basic, Standard, or Premium classic instances to a supported platform. The stv1 retirement
  did not apply to Consumption instances using mtv1. Treat the archived retirement notice as historical
  migration evidence, not a current SLA certification.
