description: Reference a Key Vault secret from the named value using an API Management managed identity
  with the required secret-read permissions. Use a versionless secret identifier for automatic refresh,
  and verify access after rotation; the documented refresh interval is up to four hours. This integration
  is not available for workspace named values. Restrict policy-editing and request-tracing access because
  storing the source secret in Key Vault does not prevent authorized API Management features from exposing
  its resolved value.
