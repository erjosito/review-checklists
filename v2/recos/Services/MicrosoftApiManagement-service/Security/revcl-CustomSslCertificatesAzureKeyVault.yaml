description: Use Key Vault certificate objects and grant the API Management managed identity the required
  access to their secret material. For custom-domain certificates, verify certificate synchronization
  and monitor access failures rather than assuming that renewal in Key Vault immediately updates the gateway.
  For backend-client certificate references, use a versionless identifier for automatic rotation; that
  integration is unavailable in workspaces. Apply the synchronization and support requirements for the
  specific certificate scenario.
