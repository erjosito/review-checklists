name: wafsg-CertificateManagementOperationalBurden
title: Offload certificate management to Azure. Ease the operational burden associated with certification
  rotation and renewals.
description: Offload certificate issuance and renewal to Azure for eligible Front Door Standard/Premium
  domains. Confirm domain ownership, association and renewal conditions and monitor certificate state.
  Where customer-managed certificates are needed, maintain supported Key Vault access and a tested rotation
  process. Do not treat managed certificates as proof that outages cannot occur.
