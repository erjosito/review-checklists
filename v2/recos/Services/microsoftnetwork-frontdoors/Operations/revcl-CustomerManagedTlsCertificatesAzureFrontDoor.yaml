description: For customer-managed certificates on Front Door Standard/Premium, use the Latest Key Vault
  certificate version when automatic rotation is intended and configure supported managed-identity access.
  Verify certificate chain, hostname match, Key Vault accessibility and successful deployment of the renewed
  version. Pinned versions require an explicit renewal process; Latest alone does not prove renewal succeeds.
