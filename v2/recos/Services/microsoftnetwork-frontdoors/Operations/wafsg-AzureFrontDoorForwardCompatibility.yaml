name: wafsg-AzureFrontDoorForwardCompatibility
title: Redirect supported HTTP requests to HTTPS with Azure Front Door
description: Configure HTTP-to-HTTPS redirection for clients that can follow redirects, choose a redirect
  status appropriate to request-method handling, and test client compatibility. The redirect changes the
  URL protocol; it does not make a client support a newer TLS version. For Standard/Premium, configure
  the rule-set redirect and validate the resulting behavior.
