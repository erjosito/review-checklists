description: Prefer Azure-managed certificates for eligible Front Door Standard/Premium custom domains,
  after validating DNS/domain ownership and renewal prerequisites. Use customer-managed certificates when
  required and operate their rotation and Key Vault access explicitly. Front Door classic is retiring
  and no longer supports managed certificates; plan migration rather than applying Standard/Premium configuration
  assumptions to classic resources. The removed query incorrectly treated CustomerCertificate or a missing
  certificate type as compliant with managed certificates. The public ARG table reference read in this
  pass did not establish the CdnResources/custom-domain surface, so assess certificate configuration and
  renewal manually.
