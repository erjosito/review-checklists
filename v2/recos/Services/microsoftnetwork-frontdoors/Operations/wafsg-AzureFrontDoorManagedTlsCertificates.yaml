name: wafsg-AzureFrontDoorManagedTlsCertificates
title: Use managed TLS certificates when possible.
description: Use Azure-managed certificates for eligible Front Door Standard/Premium custom domains to
  reduce renewal work. Maintain domain validation and monitor certificate provisioning and renewal. Use
  a documented customer-managed certificate process where managed certificates are unsuitable. Front Door
  classic requires migration planning; do not assume this modern-tier capability applies unchanged to
  classic.
