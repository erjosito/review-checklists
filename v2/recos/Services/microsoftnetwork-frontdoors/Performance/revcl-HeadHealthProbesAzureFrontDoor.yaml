description: HEAD reduces probe response traffic when the origin returns the required health status without
  a body. Confirm that the application's health endpoint handles HEAD correctly; use a justified alternative
  when it does not. Missing probe configuration is not evidence of a correct HEAD probe. Review origin-group
  settings through the service API or portal; the inherited CdnResources query has no established ARG
  table support.
