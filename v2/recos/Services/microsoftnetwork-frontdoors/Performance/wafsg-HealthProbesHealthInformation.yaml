name: wafsg-HealthProbesHealthInformation
title: Balance Front Door probe frequency with health detection and origin load
description: Review probe interval, method, endpoint behavior and the number of origins. Probes are periodic
  active requests, not a change-only subscription. For a single-origin group, consider disabling redundant
  probes while retaining independent monitoring. For multiple origins, test failure detection and recovery
  and balance probe traffic with the required responsiveness.
