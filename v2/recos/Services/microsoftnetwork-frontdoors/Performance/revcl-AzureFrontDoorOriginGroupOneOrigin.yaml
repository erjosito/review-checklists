description: For an origin group with one origin, the service guide recommends disabling redundant probes
  because health status does not change origin selection. Confirm topology, future failover requirements
  and independent application health monitoring before changing it. The inherited CdnResources/origin-child
  ARG query is not supported by the retrieved ARG table reference; inspect origin configuration through
  the service API or portal. No automatic pass is inferred.
