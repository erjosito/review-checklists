name: wafsg-AzureFrontDoorOriginGroupSingleBackEndPools
title: Review disabling Front Door probes only for a genuinely single-origin group
description: Confirm the origin group contains only one origin and that probe results are not needed for
  another operational purpose. Front Door routes to the sole origin regardless of its health status, so
  unnecessary probes can add bandwidth cost. Preserve independent availability monitoring and reassess
  probes when adding origins; this is not advice to remove multi-origin failover checks.
