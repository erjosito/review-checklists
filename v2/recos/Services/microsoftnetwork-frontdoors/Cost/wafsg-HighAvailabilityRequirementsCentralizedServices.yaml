name: wafsg-HighAvailabilityRequirementsCentralizedServices
title: Consider using a shared instance that's provided by the organization. Costs incurred from centralized
  services are shared between the workloads. However, consider the tradeoff with reliability. For mission-critical
  applications that have high availability requirements, we recommend an autonomous instance.
