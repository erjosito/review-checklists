description: Use HEAD health probes where supported, or a lightweight endpoint returning HTTP 200 when
  the origin is healthy. Avoid unnecessary response bodies and expensive work, but do not replace a meaningful
  health signal with an unconditional successful response. Verify the endpoint method, health behavior
  and failover with the application owner.
