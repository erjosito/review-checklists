description: Front Door treats only HTTP 200 as healthy; HTTP 204 is a failed health probe. Configure
  an appropriate health endpoint and use HEAD where supported to avoid a response body. Ensure the endpoint
  reflects the origin's ability to serve its intended workload. Do not disable the Functions homepage
  to manufacture a 204 probe response; verify routing and failover after any probe change.
