name: aprl-AzureCsiDriversAzureDisk
title: Upgrade Persistent Volumes using in-tree drivers to Azure CSI drivers
description: From Kubernetes 1.26, Azure Disk and Azure File in-tree drivers are deprecated in favor of
  CSI drivers. Existing deployments remain operational but untested; users should switch to CSI drivers
  for new features and SKUs.
