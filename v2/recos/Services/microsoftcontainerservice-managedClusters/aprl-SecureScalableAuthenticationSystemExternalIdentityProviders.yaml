name: aprl-SecureScalableAuthenticationSystemExternalIdentityProviders
title: Disable local accounts
description: Local Kubernetes accounts in AKS, being non-auditable and legacy, are discouraged. Microsoft
  Entra's integration offers centralized management, multi-factor authentication, RBAC for detailed access,
  and a secure, scalable authentication system compatible with Azure and external identity providers.
