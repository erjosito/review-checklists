name: aprl-AutoScalerPodCreationFailuresQuickPodProvisioning
title: Attach Virtual Nodes (ACI) to the AKS cluster
description: To rapidly scale AKS workloads, utilize virtual nodes for quick pod provisioning, unlike
  Kubernetes auto-scaler. For clusters with availability zones, ensure one nodepool per AZ due to persistent
  volumes not working across AZs, preventing auto-scaler pod creation failures if lacking access.
