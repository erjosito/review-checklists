name: aprl-ProductionAksClustersAksTier
title: Update AKS tier to Standard or Premium
description: Production AKS clusters require the Standard or Premium tier for a financially backed SLA
  and enhanced node scalability, as the free service lacks these features. Use the Premium tier for mission-critical
  workloads.
source:
  type: aprl
  file: azure-resources/ContainerService/managedClusters/recommendations.yaml
  timestamp: July 24, 2024
