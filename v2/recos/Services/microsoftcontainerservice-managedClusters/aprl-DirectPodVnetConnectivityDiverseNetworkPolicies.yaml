name: aprl-DirectPodVnetConnectivityDiverseNetworkPolicies
title: Configure Azure CNI networking for dynamic allocation of IPs or use CNI overlay
description: Azure CNI enhances cluster IP and network management, allowing dynamic IP allocation, scalable
  subnets, direct pod-VNET connectivity, and supports diverse network policies for pods and nodes with
  Azure Network Policies and Calico, optimizing network efficiency and security
