name: aprl-MultipleReplicasProductionApplications
title: Use deployments with multiple replicas to improve production availability
description: 'Configure multiple replicas in production Deployment manifests and maintain the required
  desired replica count. Replication improves availability but is not an unconditional guarantee: distribute
  replicas across appropriate nodes or zones and account for shared dependencies and disruption conditions.'
