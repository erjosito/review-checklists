title: Configure pod disruption budgets (PDBs)
description: A Pod Disruption Budget is a Kubernetes resource configuring the minimum number or percentage
  of pods that should remain available during disruptions like maintenance or scaling, ensuring a minimum
  number of pods are always available in the cluster.
