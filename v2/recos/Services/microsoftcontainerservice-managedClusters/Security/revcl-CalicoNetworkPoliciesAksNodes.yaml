description: Validate the current Windows version and networking support matrix when selecting Calico
  or another supported control. Azure Network Policy Manager on Windows reaches end of support on September
  30, 2026, and new subscriptions cannot onboard to that feature. Cilium's documented AKS support is Linux,
  so it is not a drop-in Windows replacement. Review policy limitations and test permitted and denied
  pod traffic. A private API-server setting does not establish Windows network-policy configuration or
  enforcement.
