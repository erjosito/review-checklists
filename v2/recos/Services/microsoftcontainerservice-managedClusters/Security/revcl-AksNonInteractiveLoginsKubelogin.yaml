description: 'kubelogin is the supported client credential plugin, not a preview-only noninteractive feature.
  Select a method appropriate to the caller: workload identity federation or managed identity for supported
  automation, and an interactive method compatible with Conditional Access for people. Avoid resource-owner
  password credentials and secrets persisted in kubeconfig. Verify the intended principal, tenant and
  Kubernetes authorization; successful token acquisition alone does not establish least privilege.'
