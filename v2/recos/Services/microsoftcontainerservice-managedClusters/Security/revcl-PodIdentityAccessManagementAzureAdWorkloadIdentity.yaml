description: Federate Kubernetes service accounts with Microsoft Entra identities and grant each workload
  only its required permissions. AKS Standard requires the OIDC issuer and workload identity to be enabled;
  AKS Automatic preconfigures these cluster features but applications still need identity configuration.
  Use supported Azure Identity or MSAL client libraries and test token acquisition and resource access.
  Pod identity federation is distinct from cluster and kubelet identities and is no longer a preview-only
  recommendation.
