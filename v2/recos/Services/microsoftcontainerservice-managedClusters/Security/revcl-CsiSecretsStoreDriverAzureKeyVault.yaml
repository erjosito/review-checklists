description: Configure the provider and SecretProviderClass with an authorized identity and least-privilege
  access to the required Key Vault objects. Enable secret autorotation when workloads must consume new
  upstream versions, and verify how the application reloads them. CSI rotation updates mounted content
  and optionally synchronized Kubernetes Secrets; it does not create or rotate the source credential.
  Environment-variable consumers need a pod restart, and subPath mounts do not receive automatic updates.
