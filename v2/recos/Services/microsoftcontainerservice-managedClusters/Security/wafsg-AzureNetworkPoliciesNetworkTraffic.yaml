name: wafsg-AzureNetworkPoliciesNetworkTraffic
title: Use supported AKS network policies and test the intended pod-traffic boundaries.
description: Define policies for the required ingress and egress flows and test both allowed and denied
  communication. Prefer Azure CNI Powered by Cilium for supported Linux deployments; choose an engine
  compatible with the node operating system and network model. Plan migration before Azure NPM support
  ends on September 30, 2026 for Windows or September 30, 2028 for Linux. Engine presence alone does not
  prove policies exist or enforce the intended boundaries, and service address translation can affect
  observed source and destination addresses.
