description: Review proxy endpoints, bypass destinations and trusted CA requirements for both nodes and
  pods. The documented integration does not support Windows node pools, per-node-pool proxy configurations
  or username/password proxy authentication. Confirm actual proxy variables and application behavior,
  including noProxy handling and required AKS dependencies. DDoS protection on a virtual network is not
  evidence of HTTP proxy configuration.
