description: Choose a custom node resource group name at cluster creation only when organizational naming
  requirements justify it. AKS creates and manages this group; do not supply an existing group, attempt
  to rename it later, or manually alter managed infrastructure. The query inventories nodeResourceGroup
  for naming review. The default MC_ prefix is valid, and absent properties or zero rows do not establish
  compliance.
