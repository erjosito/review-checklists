description: Prevent operators from modifying AKS-managed infrastructure directly in the node resource
  group. Use supported cluster and node-pool operations for changes and consider node resource group lockdown.
  Preserve Azure-created tags and document permitted custom-tag operations. Verify the access model and
  change history; naming conventions alone are not a governance control.
