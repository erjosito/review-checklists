name: revcl-PreferredLogManagementSolutionViaDiagnosticSettings
title: Collect required AKS control-plane resource logs with diagnostic settings
description: Configure diagnostic settings on the AKS cluster to collect the required control-plane resource-log
  categories into the approved destination. Select categories according to audit and troubleshooting requirements
  and validate that expected events arrive. Container stdout/stderr collection is separate from control-plane
  logging. Review retention, access and alert dependencies manually.
