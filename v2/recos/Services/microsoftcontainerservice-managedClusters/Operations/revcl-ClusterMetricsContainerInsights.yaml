description: Monitor cluster, node and workload metrics with Azure Monitor managed service for Prometheus
  or an approved metrics solution. Configure appropriate scraping and alerts and validate metrics arrival
  and dashboard usefulness. Container log collection and application distributed tracing are separate
  capabilities; enabling one monitoring add-on does not demonstrate coverage of all layers.
