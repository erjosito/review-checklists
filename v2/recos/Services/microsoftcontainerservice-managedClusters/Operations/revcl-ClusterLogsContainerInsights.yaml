description: Collect and analyze AKS container stdout/stderr and Kubernetes events with Container insights
  or an approved alternative. Configure control-plane resource logs separately using diagnostic settings.
  If Container insights is used, migrate legacy authentication to managed identity before the September
  30, 2026 support cutoff and verify new data, dashboards and alerts after migration. The query inventories
  the documented monitoring add-on configuration only; it does not inspect log delivery, alternate tools,
  retention or observability quality. Missing fields and zero rows are not a pass.
