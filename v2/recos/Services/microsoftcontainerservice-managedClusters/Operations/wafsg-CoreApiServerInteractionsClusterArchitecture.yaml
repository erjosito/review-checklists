name: wafsg-CoreApiServerInteractionsClusterArchitecture
title: 'Cluster architecture: Enable diagnostics settings to ensure control plane or core API server interactions
  are logged.'
description: Use AKS diagnostic settings to route required control-plane resource logs, including relevant
  API-server activity, to the approved monitoring destination. Validate category selection, permissions,
  retention and actual event arrival. Review the logs with container and application telemetry when investigating
  workload incidents.
