name: wafsg-ManyAdvancedDeploymentPatternsReleaseEngineeringProcess
title: 'Workload architecture: Use platform capabilities in your release engineering process.'
description: Use blue-green or canary deployment patterns where supported by the workload's Kubernetes
  and ingress design. Release small changes progressively, define health/usage checks and observation
  periods, halt on regressions, and test recovery including database and schema compatibility. Inspect
  release pipelines and rollout evidence; ingress configuration alone does not prove safe deployment.
