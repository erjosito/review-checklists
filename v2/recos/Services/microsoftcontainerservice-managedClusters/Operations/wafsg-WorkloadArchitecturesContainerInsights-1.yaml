name: wafsg-WorkloadArchitecturesContainerInsights-1
title: 'Cluster and workload architectures: Enable Container insights to collect metrics, logs, and diagnostics
  to monitor the availability and performance of the cluster and workloads running on it.'
description: Choose and configure container logs, Prometheus metrics, control-plane resource logs and
  application instrumentation according to cluster and workload requirements. These use separate collection
  paths. Validate actual telemetry, useful alerts and troubleshooting workflows; Container insights enablement
  alone is not evidence of availability or performance quality.
