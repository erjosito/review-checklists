name: wafsg-WorkloadArchitecturesContainerInsights-1-2
title: 'Cluster and workload architectures: Configure monitoring of cluster with Container insights.'
description: Configure Kubernetes monitoring across the layers required by the workload. Use containerized
  Azure Monitor Agent for container logs and events, managed Prometheus for metrics, diagnostic settings
  for control-plane logs and Application Insights or compatible OpenTelemetry tooling for application
  traces. Validate data arrival, alert routing and dashboards rather than assuming configuration proves
  end-to-end coverage.
