description: Consider AKS virtual nodes only for compatible Linux workloads that benefit from rapid ACI-backed
  bursting. Validate regional ACI availability, quotas, Azure CNI and subnet requirements, API-server
  access, image authentication, storage and unsupported Kubernetes features before adoption. An enabled
  add-on does not prove the workload is schedulable or that virtual nodes are required. Review deployment
  manifests and a representative burst test manually.
