name: wafsg-SeamlessOnboardingExperienceReferenceConfigureScraping
title: Configure Prometheus metric collection separately from Kubernetes log collection
description: Use Azure Monitor managed service for Prometheus to collect and query Prometheus metrics,
  or retain an approved Prometheus implementation. Configure scrape targets, labels, alert rules and visualization
  for the workload. Validate fresh samples and expected coverage; container log collection and control-plane
  diagnostic settings are separate.
