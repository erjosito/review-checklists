title: Subscription core quota should be increased if Node pool auto-scale settings exceed the quota
description: Node pool settings should not exceed the subscription core quota to ensure AKS can scale
  out nodes efficiently, meeting increased demand while reducing resource constraints and potential service
  disruptions.
