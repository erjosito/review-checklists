description: Check current AKS tier, node-pool and cluster limits before choosing a multi-cluster design.
  The retrieved core concepts guide lists up to 1,000 nodes for Free and 5,000 for Standard; verify current
  limits and supported configuration for the deployment. Account for failure isolation, operational overhead
  and load tests rather than using a single threshold as a complete scalability design.
