description: For managed OS disks, evaluate documented default sizing and measure image, log and I/O needs
  for the expected number of pods. Configure supported kubelet log rotation where necessary. Larger disks
  can change IOPS but must not substitute for workload measurement. For ephemeral disks, check available
  host storage and supported placement.
