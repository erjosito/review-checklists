name: wafsg-DifferentNodePoolsWorkloadArchitectures
title: Separate AKS workloads into node pools when independent scaling is required
description: Group workloads by scaling and scheduling requirements, configure placement, and test pool-level
  growth and contraction. Separate node pools permit independent capacity changes; they do not alone prove
  that application flows can scale independently.
