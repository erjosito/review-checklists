description: 'Read each pool''s configured maxPods and validate subnet/pod-CIDR headroom for growth and
  upgrades. Current documented defaults differ: Azure CNI Overlay 250, Azure CNI Pod Subnet 110, legacy
  Azure CNI 30, and kubenet 110. These are defaults, not desired values for every workload; the documented
  configurable maximum is 250. Verify current constraints before creating or replacing pools.'
