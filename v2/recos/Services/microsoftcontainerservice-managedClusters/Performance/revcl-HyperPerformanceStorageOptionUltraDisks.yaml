description: Consider Ultra Disks for workloads needing their performance characteristics, after checking
  VM, region, CSI and volume eligibility. Compare alternatives using measured latency, IOPS, throughput
  and cost. Premium SSDs or shared file services can be more appropriate; a high-performance workload
  does not automatically require Ultra Disks.
