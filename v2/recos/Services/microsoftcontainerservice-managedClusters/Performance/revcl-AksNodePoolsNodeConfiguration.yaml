name: revcl-AksNodePoolsNodeConfiguration
title: Customize supported AKS node settings only for measured workload needs
source:
  type: revcl
  file: ./checklists/waf_checklist.en.json
resourceTypes:
- microsoft.containerservice/managedclusters
waf: Performance
severity: 2
labels:
  guid: 831c2872-c693-4b39-a887-a561bada49bc
links:
- type: docs
  url: https://learn.microsoft.com/azure/aks/custom-node-configuration
queries:
  arg: |
    Resources
    | where type =~ 'microsoft.containerservice/managedclusters'
    | mv-expand pool = properties.agentPoolProfiles
    | project id, name, resourceGroup, subscriptionId, poolName = tostring(pool.name),
        vmSize = tostring(pool.vmSize), enableAutoScaling = pool.enableAutoScaling,
        minCount = pool.minCount, maxCount = pool.maxCount, osDiskType = tostring(pool.osDiskType),
        kubeletConfig = pool.kubeletConfig, linuxOSConfig = pool.linuxOSConfig
schemaVersion: 1
id: 831c2872-c693-4b39-a887-a561bada49bc
services: []
automation:
  status: query_available
  validatedAt: null
  resultSemantics: inventory
provenance:
  upstreamRevision: null
  lastReviewed: null
  sources:
  - url: https://learn.microsoft.com/azure/aks/custom-node-configuration
    title: Customize the node configuration for Azure Kubernetes Service (AKS) node pools
    accessedAt: '2026-09-11'
  - url: https://learn.microsoft.com/azure/governance/resource-graph/concepts/query-language
    title: Understanding the Azure Resource Graph query language
    accessedAt: '2026-09-11'
description: |-
  Review supported kubelet and OS parameters for the node pool's OS/version, apply only justified overrides, and confirm effective settings on nodes. Preview parameters require explicit eligibility and should not silently become production defaults. An autoscaler profile is not evidence of custom node configuration.

  ARG returns configuration inventory only, not utilization, latency, capacity sufficiency or a compliance verdict. Missing properties, limited permissions, truncation and zero rows do not establish a pass. Compare with workload telemetry and requirements; this query has not been executed or validated against Azure.
