description: Keep disposable pod/node storage separate from durable application state. External services
  can simplify scaling, but supported CSI persistent volumes also allow stateful AKS workloads. Select
  storage for access modes, performance, failure recovery and lifecycle requirements; do not interpret
  this check as prohibiting all stateful workloads in Kubernetes.
