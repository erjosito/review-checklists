name: revcl-AppropriateNodeSizeLargerNodes
title: Size AKS nodes using allocatable resources and workload scaling granularity
description: Include CPU/memory requests, AKS resource reservations, storage and network needs, pod density,
  and daemon overhead. Larger nodes change failure impact and scale increments; a larger SKU does not
  universally guarantee every optional feature. Load test representative workloads and verify the selected
  VM's supported features.
