name: wafsg-OngoingLoadTestingActivitiesWorkloadArchitectures
title: Continuously load test AKS pod and node autoscaling against performance targets
description: Use production-like workload mixes and infrastructure. Test normal, peak, spike and sustained
  load as appropriate, including pod scaling, node provisioning delay, resource requests, subnet/quota
  headroom and safe scale-in. Compare latency percentiles, throughput and errors against documented targets
  and previous baselines. Keep test scripts and results, and use approved exposure limits and rollback
  procedures. Configuration inventory cannot replace these tests.
