    notes: AKS autoscaler review addresses controlled per-pool scale and constraints, not the complete
      workload scale-unit and partitioning design.
description: |-
  Enable autoscaling on suitable node pools and choose tested minimum/maximum counts. The cluster autoscaler reacts to unschedulable pods, not merely node CPU pressure; coordinate pod requests, HPA/KEDA, quotas, subnet headroom and eviction constraints. A cluster-wide autoScalerProfile configures behavior but does not prove a pool has autoscaling enabled.

  ARG returns configuration inventory only, not utilization, latency, capacity sufficiency or a compliance verdict. Missing properties, limited permissions, truncation and zero rows do not establish a pass. Compare with workload telemetry and requirements; this query has not been executed or validated against Azure.
