description: For Azure CNI Overlay, reserve node subnet space separately from the pod CIDR, which allocates
  a /24 pod block per node. For flat pod networking, plan both node and pod subnet consumption according
  to its allocation mode. Include maximum node growth, upgrade surge, internal service addresses and temporary
  allocation overhead. A formula for legacy Azure CNI is not universal across CNI modes.
