name: wafsg-VerticalPodAutoscalerWorkloadArchitecture
title: Use VPA recommendations to rightsize AKS pod requests safely
description: Start with VPA updateMode Off and representative utilization to review requests without automatic
  pod changes. Validate platform/workload support, resource policies, PDBs and interaction with HPA, especially
  when both use CPU or memory. Test any updating mode and verify that freed pod capacity can lead to safe
  node scale-in.
source:
  type: wafsg
  file: ./checklists-ext/wafsg_checklist.en.json
