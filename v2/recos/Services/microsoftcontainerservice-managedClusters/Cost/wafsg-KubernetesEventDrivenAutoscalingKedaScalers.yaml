name: wafsg-KubernetesEventDrivenAutoscalingKedaScalers
title: Use supported KEDA scalers for event-driven AKS workload demand
description: Select a currently supported KEDA scaler for the workload's event source and test minimum/maximum
  replicas, event lag, startup behavior and scale-down safety. Coordinate pod demand with available node
  capacity. Do not depend on a fixed advertised scaler count or assume scale-to-zero suits every workload.
