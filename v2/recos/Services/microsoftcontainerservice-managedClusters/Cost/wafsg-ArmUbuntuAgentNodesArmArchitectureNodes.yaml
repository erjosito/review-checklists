name: wafsg-ArmUbuntuAgentNodesArmArchitectureNodes
title: Evaluate Arm64 AKS node pools against workload compatibility and price-performance
description: Compare supported Arm64 node pools with other node architectures using representative workloads,
  compatible container images, dependencies and regional capacity. Test application behavior and operational
  support before migration. Arm64 is a processor architecture, not Azure Resource Manager, and lower cost
  or higher performance is not guaranteed for every workload.
