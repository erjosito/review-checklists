queries:
  arg: |-
    Resources
    | where type =~ 'microsoft.containerservice/managedclusters'
    | mv-expand pool = properties.agentPoolProfiles limit 2000
    | project id, name, subscriptionId, resourceGroup, location,
        poolName = tostring(pool.name), mode = tostring(pool.mode),
        vmSize = tostring(pool.vmSize), count = toint(pool['count']),
        autoScaleEnabled = tobool(pool.enableAutoScaling),
        minCount = toint(pool.minCount), maxCount = toint(pool.maxCount),
        priority = tostring(pool.scaleSetPriority), clusterTier = tostring(sku.tier)
