description: Review per-pool minimum/maximum node counts, SKU and autoscaling configuration with pending
  pods, requests, utilization, PDBs and startup time. Tune scale-down only after validating workload availability
  and recovery. A disabled autoscaler or fixed node floor can be intentional, and node-autoprovisioned
  capacity requires its own review.
