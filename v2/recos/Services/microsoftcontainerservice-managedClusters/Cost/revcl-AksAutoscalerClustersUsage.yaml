automation:
  status: query_available
  validatedAt: null
  notes: |-
    Documented ARG evidence query available, but unvalidated and inventory-only; the optimization decision still requires human review and additional data.

    Only the primary ARG query below is executed by the app. Supplemental variants, if any, are documentation-only in cost-research.json.

    All visible agent-pool profiles, not a list of inefficient or noncompliant clusters.

    No live Azure execution or compilation was performed. Empty or truncated results do not establish compliance, realized savings or permission to change resources.

    Required scope/data: Read access to the resources/recommendations in the reviewer-selected subscriptions or management-group scope; no scope IDs are invented or embedded. For relationship/absence checks, include all relevant related resources and verify visibility before interpreting unmatched rows. Billing, utilization metrics and business/retention context must be reviewed separately to estimate net savings.

    Caveats: ARG is a scoped, eventually consistent control-plane index. Missing rows, fields, permissions or subscriptions are not evidence of compliance. Retrieve complete query results using the client's supported paging and respect ARG result/expansion limits; truncated output is not a complete inventory. Inventory identifies review candidates, not realized savings or authorization to change/delete resources. Review ownership, change windows, retention, security, availability, dependencies and current negotiated pricing before action. Pool profiles do not contain Kubernetes pod demand, PDBs, actual utilization, pending pods or savings. System pools, cluster mode and node-autoprovisioned capacity may require different treatment. Absence of Spot is not a defect. The explicit 2,000-item expansion limit is the documented ARG maximum; confirm no array exceeds it before treating the inventory as complete. One row per pool repeats cluster id; consumers must preserve poolName and not collapse evidence by id alone.
  resultSemantics: inventory
