name: wafsg-CostSavingGoalsCloudFinancialDiscipline
title: 'Cluster and workload architectures: Adopt a cloud financial discipline and cultural practice to
  drive ownership of cloud usage.'
description: The foundation of enabling cost optimization is the spread of a cost saving cluster. A financial
  operations approach (FinOps) is often used to help organizations reduce cloud costs. It is a practice
  involving collaboration between finance, operations, and engineering teams to drive alignment on cost
  saving goals and bring transparency to cloud costs.
