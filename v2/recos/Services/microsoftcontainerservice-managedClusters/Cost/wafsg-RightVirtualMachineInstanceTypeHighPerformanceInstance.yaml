name: wafsg-RightVirtualMachineInstanceTypeHighPerformanceInstance
title: Select AKS node VM types from measured workload and availability requirements
description: Compare node VM types using pod requests, utilization, performance and availability requirements.
  Oversized nodes waste capacity; undersized nodes can increase contention, execution time and disruption.
  Test the selected type and account for autoscaling behavior rather than assuming a powerful instance
  itself causes performance problems.
