description: Review automatic pause settings and idle timeout against job arrival patterns, startup overhead
  and SLA. Use Advisor recommendations as a starting point, verify the pool configuration and confirm
  realized compute reduction using usage data. Do not assume workspace-level Advisor absence proves every
  pool is optimized.
