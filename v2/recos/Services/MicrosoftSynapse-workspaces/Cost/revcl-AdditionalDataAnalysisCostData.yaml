description: Schedule supported Cost Management exports with an explicit dataset/version, billing scope
  and retention policy. Where appropriate, use FOCUS to retain BilledCost and EffectiveCost together,
  preserving currency, charge-period and commitment semantics. Monitor run history and data completeness,
  reconcile totals to the billing view and account for export storage/processing cost.
