description: Select pool/node sizes for measured workload needs and enable supported autoscaling with
  tested minimum/maximum limits. Review job performance, contention and startup overhead before splitting
  workloads across pool definitions. Validate that reduced unused capacity outweighs operational and execution
  cost.
