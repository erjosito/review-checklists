name: aprl-NsgFlowLogsOpenInternetPorts
title: Migrate NSG flow logging to virtual network flow logs
description: Use virtual network flow logs for new network flow logging and migrate existing NSG flow
  logs before their September 30, 2027 retirement. New NSG flow-log creation is no longer supported. Review
  logging scope, storage, retention, and Traffic Analytics requirements and verify the new flow logs before
  retiring the old configuration. Existing stored NSG flow-log records remain subject to their configured
  retention; do not interpret an NSG without its own flow-log resource as a violation after migration.
