name: aprl-AzureNetworkSecurityGroupsDefaultSecurityRules
title: The NSG only has Default Security Rules, make sure to configure the necessary rules
description: Azure network security groups filter network traffic between resources in a virtual network,
  using security rules to allow or deny inbound or outbound traffic based on source, destination, port,
  and protocol.
source:
  type: aprl
  file: azure-resources/Network/networkSecurityGroups/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
