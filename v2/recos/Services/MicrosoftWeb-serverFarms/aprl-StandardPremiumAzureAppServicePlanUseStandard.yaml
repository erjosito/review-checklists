name: aprl-StandardPremiumAzureAppServicePlanUseStandard
title: Use Standard or Premium tier
description: Choose Standard/Premium Azure App Service Plan for robust apps with advanced scaling, high
  availability, better performance, and multiple slots, ensuring resilience and continuous operation.
source:
