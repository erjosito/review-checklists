name: aprl-HostPoolScheduledAgentUpdatesAzureVirtualDesktopAgent
title: Configure host pool scheduled agent updates
description: Create up to two maintenance windows for the Azure Virtual Desktop agent, side-by-side stack,
  and Geneva Monitoring agent to get updated so that updates don't happen during peak business hours.
