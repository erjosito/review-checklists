name: aprl-UniqueOuHostPools
title: Ensure a unique OU is used when deploying host pools with domain joined session hosts
description: Place domain joined session hosts VMs in unique OUs. Segregate Prod and DR units for environment-specific
  settings. This ensures targeted configurations for session hosts, including FSLogix, session controls,
  etc.
