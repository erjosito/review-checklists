name: wafsg-MinimumRecommendedRetentionPeriodPremiumFileShares
title: Set Azure Files soft-delete retention from recovery needs and the billing model
description: Choose retention that meets recovery and data-governance requirements, then estimate retained
  used-capacity cost. Provisioned v2 uses a Soft-Deleted Usage meter; provisioned v1 uses the snapshot
  storage meter. Confirm the applicable model and resource support instead of applying one premium/standard
  snapshot-rate rule to every share. Do not shorten retention solely to minimize cost.
