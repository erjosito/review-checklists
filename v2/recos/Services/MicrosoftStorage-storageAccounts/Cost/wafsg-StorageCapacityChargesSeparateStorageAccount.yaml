name: wafsg-StorageCapacityChargesSeparateStorageAccount
title: Control Blob version growth while preserving required recovery history
description: Measure version growth and access/restore needs, and apply approved version-retention/lifecycle
  rules. Consider separate policies for transient versus durable data only when requirements differ. Preserve
  needed historical versions and compliance controls rather than disabling versioning by default.
