name: wafsg-LifecycleManagementPolicyOldBlobVersions
title: Expire obsolete Blob versions with approved lifecycle and recovery safeguards
description: Use version-age and lifecycle rules to control growth only after establishing recovery, audit
  and retention requirements. Test the selected version population and protect legal holds and required
  history. Review capacity effects after rollout; enabling versioning is not permission to automatically
  erase all older versions.
