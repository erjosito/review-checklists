title: Compare current Azure Files billing models and independent provisioning
description: Distinguish provisioned v2, provisioned v1 and pay-as-you-go rather than equating HDD with
  PAYG and SSD with one provisioned model. For eligible deployments, evaluate provisioned v2 capacity,
  IOPS and throughput independently. Compare current media, protocol, redundancy, resource-model and regional
  support with total workload cost before migration.
