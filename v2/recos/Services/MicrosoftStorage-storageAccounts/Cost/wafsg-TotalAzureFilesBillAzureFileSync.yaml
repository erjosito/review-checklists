name: wafsg-TotalAzureFilesBillAzureFileSync
title: Monitor differential Azure Files snapshots using the correct billing model
description: 'Track snapshot growth and required retention, including snapshots produced by value-added
  services such as Azure File Sync. Snapshots are differential, but billing depends on the model: provisioned
  v2 charges overflow when live data plus differential snapshots exceed provisioned storage; provisioned
  v1 bills differential snapshot usage separately. Reconcile the appropriate meters instead of assuming
  every snapshot always adds a separate charge.'
