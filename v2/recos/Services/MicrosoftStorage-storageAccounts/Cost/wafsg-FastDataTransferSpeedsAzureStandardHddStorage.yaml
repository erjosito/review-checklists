name: wafsg-FastDataTransferSpeedsAzureStandardHddStorage
title: Choose Azure Files media and provisioning from measured performance requirements
description: Compare SSD and HDD using required latency, IOPS, throughput, capacity and protocol support.
  Separately compare provisioned v2, provisioned v1 and PAYG where supported; HDD does not imply PAYG.
  Validate the current resource-model/protocol matrix and actual rates instead of assuming NFS and SMB
  always have identical pricing.
