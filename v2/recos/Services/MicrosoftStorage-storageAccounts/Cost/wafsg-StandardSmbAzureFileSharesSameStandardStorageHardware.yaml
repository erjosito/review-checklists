name: wafsg-StandardSmbAzureFileSharesSameStandardStorageHardware
title: Apply hot, cool and transaction-optimized tier comparisons only to PAYG Azure Files
description: The three access tiers apply to HDD classic file shares using PAYG billing. Compare capacity,
  transaction and transfer costs using observed usage. Provisioned v2 separately bills provisioned storage,
  IOPS and throughput and is the recommended starting point for new deployments; do not apply PAYG tier
  rules to provisioned shares.
