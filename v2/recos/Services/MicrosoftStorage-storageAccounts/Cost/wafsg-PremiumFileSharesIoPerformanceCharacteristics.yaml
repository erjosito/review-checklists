name: wafsg-PremiumFileSharesIoPerformanceCharacteristics
title: Provision Azure Files capacity and performance from measured demand
description: Measure capacity, IOPS, throughput, latency and growth. For provisioned v2, size the dimensions
  independently with tested headroom; for v1 account for coupled performance/capacity. Respect scale-down
  timing and minimums. Avoid a blanket two-to-three-times capacity multiplier and reassess provisioned
  versus consumed resources regularly.
