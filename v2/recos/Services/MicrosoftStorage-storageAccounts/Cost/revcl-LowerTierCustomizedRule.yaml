description: Classify data using access frequency, restore latency and retention needs, then choose tiering/expiry
  rules. Model transaction, retrieval, rehydration and early-deletion effects before large transitions.
  Test the selected population and preserve legal holds and recovery requirements; account-level tier
  alone does not describe all blobs.
