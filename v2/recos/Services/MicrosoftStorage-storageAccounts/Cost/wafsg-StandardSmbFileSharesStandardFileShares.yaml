name: wafsg-StandardSmbFileSharesStandardFileShares
title: Choose Azure Files resource, redundancy and billing boundaries deliberately
description: Compare classic shares in storage accounts with the supported top-level file-share resource
  model. Check protocol, media, redundancy and regional availability, and prefer provisioned v2 for new
  deployments unless a documented requirement dictates otherwise. Group classic shares into storage accounts
  according to billing attribution and shared capacity limits, rather than assuming one share per account
  is always required.
