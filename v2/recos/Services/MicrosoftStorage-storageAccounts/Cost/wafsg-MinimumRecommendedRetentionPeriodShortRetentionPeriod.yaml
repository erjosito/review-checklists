name: wafsg-MinimumRecommendedRetentionPeriodShortRetentionPeriod
title: Balance Blob soft-delete retention with recoverability and churn cost
description: Measure retained capacity from overwrites and deletions, then choose approved soft-delete
  retention and lifecycle policies that meet recovery and compliance objectives. Isolate high-churn data
  only when its protection requirements justify a different policy. Do not disable recovery protection
  or shorten retention solely to reduce cost.
