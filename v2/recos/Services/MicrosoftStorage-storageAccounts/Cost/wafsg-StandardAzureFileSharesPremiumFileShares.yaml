name: wafsg-StandardAzureFileSharesPremiumFileShares
title: Separate Azure Files migration transaction cost from steady-state billing choice
description: If a migration uses PAYG HDD classic shares, start with the transaction-optimized tier and
  reassess after representative steady-state usage. Migration traffic is not a reliable normal-operation
  baseline. Evaluate provisioned v2 for new deployments and compare total provisioned versus consumed-resource
  costs; do not select PAYG solely because the storage media is HDD.
