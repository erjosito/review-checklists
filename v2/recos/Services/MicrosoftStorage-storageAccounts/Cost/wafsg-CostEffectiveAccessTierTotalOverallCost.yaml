name: wafsg-CostEffectiveAccessTierTotalOverallCost
title: Choose Azure Files PAYG access tiers from measured capacity and transactions
description: 'For existing PAYG HDD classic shares, compare transaction-optimized, hot and cool tiers
  using representative operation counts and stored capacity. Cool is not universally cheapest: higher
  transaction charges can outweigh lower capacity prices. Include tier-switch transactions. Evaluate the
  recommended provisioned v2 model separately rather than assuming every HDD share uses PAYG.'
