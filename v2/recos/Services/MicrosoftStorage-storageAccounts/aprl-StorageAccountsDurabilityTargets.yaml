name: aprl-StorageAccountsDurabilityTargets
title: Ensure that storage accounts are zone or region redundant
description: Redundancy ensures storage accounts meet availability and durability targets amidst failures,
  weighing lower costs against higher availability. Locally redundant storage offers the least durability
  at the lowest cost.
