name: revcl-StorageAccountKeysStoredAccessPolicies
title: Use stored access policies only with service SAS and plan revocation for every SAS type.
description: A stored access policy can centrally constrain and revoke a service SAS without rotating
  the account key. User delegation SAS and account SAS cannot reference a stored access policy. Prefer
  user delegation SAS where supported and use an appropriate short lifetime and revocation process rather
  than switching to account-key credentials merely to obtain a stored policy.
