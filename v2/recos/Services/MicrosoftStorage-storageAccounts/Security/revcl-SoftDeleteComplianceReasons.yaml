name: revcl-SoftDeleteComplianceReasons
title: Reconcile container soft-delete retention with approved erasure requirements before making exceptions.
description: Enable container soft delete by default to recover deleted containers and their contents.
  It is configured for the storage account, not selectively disabled for individual containers. Any exception
  needs an approved retention and erasure design that considers recovery obligations, backups and other
  retained copies. Turning off container soft delete does not purge containers already retained; their
  original retention periods still apply.
