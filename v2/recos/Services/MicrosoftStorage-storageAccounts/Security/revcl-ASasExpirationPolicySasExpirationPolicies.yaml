name: revcl-ASasExpirationPolicySasExpirationPolicies
title: Configure SAS expiration limits, monitor violations and enforce Block where compatible.
description: Set an appropriate maximum validity interval and require a signed start time. Start with
  Log and diagnostic logging to identify affected clients, then use Block after confirming compatibility.
  The policy covers user delegation, service and account SAS, but expiration actions do not apply to user
  delegation SAS through the HDFS endpoint or service SAS linked to a stored access policy. A user delegation
  SAS remains bounded by its seven-day maximum and delegation-key expiry. Account for Azure File Sync's
  minimum three-day SAS interval where used. ARG configuration cannot enumerate all issued SAS or prove
  their use is compliant.
