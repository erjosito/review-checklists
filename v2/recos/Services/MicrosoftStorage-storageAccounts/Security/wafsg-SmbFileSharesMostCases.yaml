name: wafsg-SmbFileSharesMostCases
title: Require encryption for SMB Azure Files and retire clients that cannot meet the security baseline.
description: Assess the dedicated SMB Require encryption in transit setting together with Secure transfer
  required for REST access. Defaults can differ between portal and programmatic provisioning, so inspect
  the effective configuration. Upgrade incompatible clients rather than routinely weakening transport
  protection. Any temporary exception requires an approved risk decision, constrained network access and
  a migration plan; network isolation alone is not transport encryption.
