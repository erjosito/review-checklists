description: For local users, enable ACL authorization and use the supported owning-user, owning-group
  and other-user permissions. Named-user and named-group ACL entries are not supported for local-user
  authorization. Container permissions are evaluated first; ACLs cannot restrict an operation already
  allowed at container scope. Verify access to parent directories and target paths with the intended user.
  Microsoft Entra-based SFTP has a different identity and authorization model.
