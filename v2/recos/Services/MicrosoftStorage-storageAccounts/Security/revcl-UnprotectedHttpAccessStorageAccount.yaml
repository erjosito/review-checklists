name: revcl-UnprotectedHttpAccessStorageAccount
title: Require secure transfer for Storage REST requests rather than assuming port 80 is closed.
description: Enable Secure transfer required so REST requests made over HTTP are rejected and clients
  use HTTPS. This is an application protocol requirement, not a firewall rule that closes a shared service
  port. Review Azure Files SMB and NFS per-protocol encryption settings separately and verify actual client
  behavior. Configuration alone is not proof that every workload data path is encrypted.
