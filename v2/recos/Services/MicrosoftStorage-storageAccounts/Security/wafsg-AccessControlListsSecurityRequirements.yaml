name: wafsg-AccessControlListsSecurityRequirements
title: Verify NFS Azure Files security requirements, including supported encryption in transit.
description: Azure Files NFSv4.1 supports encryption in transit, but does not provide Kerberos user authentication
  or NFS ACLs. Use supported Linux clients, restricted network access, and appropriate POSIX permissions
  and root-squash configuration. Review Require Encryption in Transit for NFS and client configuration
  rather than assuming the storage-account secure-transfer default is sufficient. Validate the capabilities
  of the selected Microsoft.Storage or Microsoft.FileShares resource model.
