name: wafsg-AzureResourceManagerLockMaliciousDeletion
title: Use an appropriate resource lock to protect the storage account's control plane.
description: A CanNotDelete lock helps prevent deletion of the storage account through Azure Resource
  Manager while allowing normal configuration changes. ReadOnly is more restrictive and can interfere
  with operations such as key listing and role assignment. Neither lock prevents data-plane deletion or
  modification of blobs, files, queues or tables. Combine locks with least-privilege access, service-level
  protection and recovery controls, and restrict who can remove a lock.
