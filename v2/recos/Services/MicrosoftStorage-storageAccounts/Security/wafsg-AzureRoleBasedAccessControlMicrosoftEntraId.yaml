name: wafsg-AzureRoleBasedAccessControlMicrosoftEntraId
title: Authorize Blob access with least-privilege Azure RBAC and protect the caller's credentials.
description: 'Use Microsoft Entra identities and appropriate Blob data roles rather than distributing
  account keys. Prefer managed identities or federation where supported. RBAC does not itself remove credentials:
  a user or application may still authenticate with credentials, and access tokens must be protected.
  Verify both the principal''s authentication and its effective role scope.'
