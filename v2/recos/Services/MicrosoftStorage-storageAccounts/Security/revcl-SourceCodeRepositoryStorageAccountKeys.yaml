description: 'Use secret scanning in development and deployment workflows to detect connection strings,
  account keys and SAS tokens before distribution. Include existing history and generated artifacts in
  the review, restrict access to findings, and avoid recording secret values in evidence. Treat an exposed
  credential as compromised: revoke or rotate it and update consumers rather than only deleting its text
  from the repository. Prefer managed identities where supported.'
