name: revcl-SoftDeleteBlobContainers
title: Reconcile blob soft-delete retention with approved erasure requirements before making exceptions.
description: Enable blob soft delete by default as part of data protection. If a documented privacy or
  legal requirement conflicts with retention, have the data owner approve an account-level protection
  and erasure design rather than suggesting a per-container soft-delete switch. Disabling blob soft delete
  does not immediately purge objects already retained; their existing retention remains in effect. Consider
  versions, snapshots, backups and other retention controls before claiming erasure, and test the approved
  recovery and deletion processes.
