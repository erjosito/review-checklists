name: wafsg-SecureTransferStorageAccounts
title: Require HTTPS for Storage REST access and assess file-protocol encryption independently.
description: Enable Secure transfer required to reject unencrypted REST requests. For Azure Files, review
  the separate SMB and NFS Require encryption in transit controls and the creation-tool-dependent defaults.
  Do not infer protection of every protocol solely from the storage-account setting; verify each enabled
  protocol and its clients.
