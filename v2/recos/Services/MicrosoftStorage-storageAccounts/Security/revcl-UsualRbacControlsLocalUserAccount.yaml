name: revcl-UsualRbacControlsLocalUserAccount
title: Minimize Blob SFTP local users and evaluate Microsoft Entra-based SFTP authentication.
description: Use only the local accounts and permissions required by the workload, audit ownership, and
  remove obsolete access. Local-user permissions remain separate from Microsoft Entra RBAC and can grant
  broader access than REST paths. Microsoft Entra-based SFTP is now documented and supports the existing
  RBAC, ABAC and ACL model through short-lived OpenSSH certificates; verify client support and identity
  requirements before migration. Do not assume password plus SSH key provides MFA for local SFTP users.
