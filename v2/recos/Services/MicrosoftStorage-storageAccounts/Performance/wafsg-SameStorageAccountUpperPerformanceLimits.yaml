name: wafsg-SameStorageAccountUpperPerformanceLimits
title: Optimize Azure Files for measured data and metadata access patterns
description: Measure latency, IOPS, throughput, parallelism and the mix of metadata versus data operations.
  For metadata-heavy SSD SMB workloads, evaluate supported metadata caching to reduce metadata latency
  and increase scale. Test before partitioning a share into multiple shares, and retain access/namespace
  compatibility. Share inventory cannot establish metadata performance.
