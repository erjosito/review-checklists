name: wafsg-HashTagPrefixesBlobPartitionKey
title: Evaluate Blob partition-key prefixes for small-block access patterns
description: For small block sizes, a distributed hash or early varying prefix can help spread requests
  across partitions. High-throughput block blobs use different optimizations and are not governed by the
  same naming advice. Benchmark naming and access patterns before changing them; a prefix is not a universal
  guarantee of faster listing or queries. Plan compatibility before renaming existing objects.
