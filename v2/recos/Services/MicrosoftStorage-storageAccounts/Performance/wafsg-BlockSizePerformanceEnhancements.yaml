name: wafsg-BlockSizePerformanceEnhancements
title: Tune Blob transfer block sizes for the storage tier and client workload
description: Benchmark block size together with concurrency, memory and request overhead. The general
  checklist mentions blocks larger than 256 KiB; the current developer checklist distinguishes sizes above
  4 MiB for standard and 256 KiB for premium high-throughput transfers. Do not apply 256 KiB as a universal
  standard-tier optimum. Verify the current SDK/tier guidance and retain measured results.
