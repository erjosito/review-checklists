name: wafsg-MobileDeviceAppsPremisesEnterpriseServices
title: Locate Blob accounts and replicas according to client access patterns
description: Place storage near consumers where residency and resilience requirements permit. Use separate
  regional accounts for separate data sets, or evaluate asynchronous object replication for shared subsets.
  Measure latency and consistency requirements and evaluate transfer charges for the actual topology;
  do not infer universally free bandwidth from regional co-location.
