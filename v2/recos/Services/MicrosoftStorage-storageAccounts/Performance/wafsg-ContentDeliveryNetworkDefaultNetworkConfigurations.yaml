name: wafsg-ContentDeliveryNetworkDefaultNetworkConfigurations
title: Place Blob data near clients and test the end-to-end network path
description: Prefer the same region as Azure clients where residency and resilience requirements allow.
  Consider object replication for appropriate remote data or Front Door for web distribution. Measure
  network throughput and latency, client capability and security-path overhead; do not claim that network
  configuration can never affect performance.
