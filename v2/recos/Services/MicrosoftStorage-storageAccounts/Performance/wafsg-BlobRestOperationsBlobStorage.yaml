name: wafsg-BlobRestOperationsBlobStorage
title: Use current Azure Storage SDKs and bounded transfer concurrency
description: Prefer maintained Storage client libraries and tune parallel transfers to client/network
  capability and storage performance targets. Use bounded exponential backoff for transient failures and
  server-side copy APIs where suitable. Test throughput, latency and throttling. Do not assume an old
  query-acceleration feature is universally available or appropriate.
