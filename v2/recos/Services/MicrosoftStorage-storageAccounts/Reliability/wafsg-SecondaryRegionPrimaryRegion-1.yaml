name: wafsg-SecondaryRegionPrimaryRegion-1
title: Design Azure Files clients for supported failover rather than direct secondary reads
description: Azure Files does not support read-access geo-redundant storage. GRS/GZRS data in a secondary
  region is unavailable for direct read/write access until a supported failover completes. Check share/account
  and regional support, plan client reconnection and application recovery, and account for unreplicated
  writes and possible data inconsistencies.
