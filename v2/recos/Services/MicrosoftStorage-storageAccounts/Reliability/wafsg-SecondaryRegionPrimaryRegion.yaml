name: wafsg-SecondaryRegionPrimaryRegion
title: Use RA-GRS or RA-GZRS for Blob secondary reads before account failover
description: Applications needing read access to Blob data in the secondary region before failover must
  use RA-GRS or RA-GZRS and explicitly support the secondary endpoint. Plain GRS/GZRS does not expose
  secondary data until failover completes. Test read-only degraded operation, stale data handling and
  client retries; asynchronous replication means the secondary can lag behind the primary.
