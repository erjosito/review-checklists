name: wafsg-MaximumDurabilityAvailabilityZones-1
title: Plan Azure Files redundancy without relying on read-access geo-redundancy
description: Select a supported Azure Files redundancy option for the account, share type and region.
  Azure Files does not support RA-GRS or RA-GZRS secondary reads before failover. Where geographic redundancy
  is supported, document and test the required account failover and client reconnection process, with
  asynchronous data-loss considerations. Do not promise direct secondary read access during a primary-region
  outage.
