name: revcl-AppropriateDataRedundancyOptionAzureStorage
title: Select Azure Storage redundancy from availability, recovery and residency requirements
description: Use ZRS for zone resilience in the primary region where supported and GZRS when asynchronous
  replication to a supported secondary region is also required. Compare supported service, account type
  and regional options with data residency and cost requirements. Geo-replication can lose recent unreplicated
  writes; redundancy also replicates accidental deletion and overwrite, so use separate data-protection
  and recovery controls.
