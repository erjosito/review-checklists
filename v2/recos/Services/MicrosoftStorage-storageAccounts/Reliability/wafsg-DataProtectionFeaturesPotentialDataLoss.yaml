name: wafsg-DataProtectionFeaturesPotentialDataLoss
title: Test a Storage recovery plan covering backups, failover, data loss and application dependencies
description: Set RTO/RPO, choose service-appropriate protection and document restore/failover sequencing,
  permissions, application reconnection and failback. Account for asynchronous replication loss, integrity
  checks, time and cost of recovery, and limitations of Blob and Files configurations. Keep plans accessible
  during outages and use authorized recovery exercises to measure results. Neither a redundancy setting
  nor existence of a backup proves recoverability.
