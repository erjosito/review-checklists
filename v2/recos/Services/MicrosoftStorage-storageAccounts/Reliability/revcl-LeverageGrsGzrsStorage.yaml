description: ZRS supports primary-region zone resilience; GRS adds asynchronous secondary-region replication
  but does not provide the same primary-zone resilience as GZRS. Use GZRS when both are required and supported.
  Secondary reads before failover require RA-GRS or RA-GZRS for supported services; Azure Files does not
  support read-access geo-redundancy. Test client behavior and recovery procedures rather than treating
  any geo-redundant SKU as highest availability.
