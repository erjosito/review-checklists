name: aprl-PartnerEdgeRoutingDevicesBidirectionalForwardingDetection
title: Activate Bidirectional Forwarding Detection on edge devices for faster failover
description: Enabling BFD over ExpressRoute speeds up link failure detection between MSEE devices and
  routers configured for ExpressRoute (CE/PE), applicable over both customer and Partner Edge routing
  devices with managed Layer 3 service.
