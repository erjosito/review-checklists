name: aprl-ExpressrouteCircuitActiveMode
title: Ensure both connections of an ExpressRoute are configured in active-active mode
description: Operating both connections of an ExpressRoute circuit in active-active mode enhances high
  availability as the Microsoft network will load balance the traffic across the connections on a per-flow
  basis.
