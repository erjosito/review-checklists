name: wafsg-ErgwAzVirtualNetworkGatewayAzureVirtualNetwork
title: Check current ExpressRoute FastPath eligibility before enabling it
description: Supported gateway options include Ultra Performance, ErGw3AZ, and ErGwScale with at least
  10 scale units. Virtual WAN uses separate eligibility rules. Direct and provider circuits support different
  FastPath features; verify same-region peering, Private Link enrollment/service support, IP capacity
  and fallback paths. Measure performance after changes rather than promising throughput from enablement
  alone.
