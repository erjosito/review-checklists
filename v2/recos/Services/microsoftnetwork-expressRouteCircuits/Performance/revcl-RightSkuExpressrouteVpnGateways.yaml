description: |-
  Compare current SKU throughput, connection and feature limits with workload traffic, concurrency, routing and availability requirements. For ExpressRoute, assess scalable gateway options and FastPath eligibility separately. Basic or Standard appearing in a SKU name is not sufficient evidence of noncompliance.

  ARG returns configuration inventory only, not utilization, latency, capacity sufficiency or a compliance verdict. Missing properties, limited permissions, truncation and zero rows do not establish a pass. Compare with workload telemetry and requirements; this query has not been executed or validated against Azure.
