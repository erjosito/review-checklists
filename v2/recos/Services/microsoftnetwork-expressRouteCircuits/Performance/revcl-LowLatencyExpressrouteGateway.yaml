description: Check circuit type, gateway SKU, scale units and destination topology against current FastPath
  support. FastPath bypasses the gateway for eligible data paths but does not remove the need for a gateway
  to exchange routes. Unsupported routes and capacity overflow can still use the gateway. Benchmark end-to-end
  latency and throughput; exceeding 10 Gbps is not itself an eligibility test.
