name: wafsg-TestExpressrouteGatewayPerformanceWorkLoadRequirements-1
title: Test ExpressRoute end-to-end performance against workload requirements
description: Measure throughput and latency with representative clients, destinations, flow counts and
  payloads across the ExpressRoute path. The service guide references Azure Connectivity Toolkit as one
  option. Schedule bandwidth-intensive tests outside peak production periods or use an approved isolated
  test scope. Record circuit and gateway telemetry together; configured bandwidth is not an achieved-performance
  result.
