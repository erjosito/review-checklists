name: wafsg-HigherGatewaySkuExpressrouteGateway
title: Scale ExpressRoute gateway capacity when measurements justify it
description: Compare measured gateway throughput, flows and routes with the selected SKU's current capacity.
  Evaluate higher or scalable gateway SKUs and test the end-to-end path. Gateway scaling does not remove
  circuit, provider, client or destination limits; do not upgrade solely because a larger tier exists.
