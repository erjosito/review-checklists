name: aprl-DistinctNetworkEdgeDevicesExpressroutePeeringLocation
title: Ensure ExpressRoute's physical links connect to distinct network edge devices
description: Microsoft or the ExpressRoute provider always ensures physical redundancy in their services.
  It's essential to maintain this level of physical redundancy (two devices, two links) from the ExpressRoute
  peering location to your network for optimal performance and reliability.
