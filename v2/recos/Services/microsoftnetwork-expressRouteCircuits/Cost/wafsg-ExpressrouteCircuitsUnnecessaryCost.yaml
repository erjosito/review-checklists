name: wafsg-ExpressrouteCircuitsUnnecessaryCost
title: Retire unused ExpressRoute circuits and review residual gateway charges
description: Investigate unprovisioned or no-longer-needed circuits with connectivity owners and the service
  provider. Validate redundancy, migrations and recovery plans, then follow the supported provider deprovisioning
  and Azure deletion process. Review dependent gateways and remaining provider/port charges separately.
source:
  type: wafsg
  file: ./checklists-ext/wafsg_checklist.en.json
resourceTypes:
- microsoft.network/expressroutecircuits
waf: Cost
severity: 1
labels:
  guid: c36e0c83-11b4-409a-a4a6-2118b52a380f
links: []
queries:
  arg: |-
    Resources
    | where type =~ 'microsoft.network/expressroutecircuits'
    | where properties.serviceProviderProvisioningState == 'NotProvisioned'
    | project id, name, subscriptionId, resourceGroup, location, sku,
        peeringLocation = tostring(properties.serviceProviderProperties.peeringLocation),
        bandwidthMbps = tolong(properties.serviceProviderProperties.bandwidthInMbps)
