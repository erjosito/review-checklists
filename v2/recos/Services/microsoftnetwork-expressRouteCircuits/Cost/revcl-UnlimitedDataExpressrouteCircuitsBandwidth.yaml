  notes: |-
    Documented ARG evidence query available, but unvalidated and inventory-only; the optimization decision still requires human review and additional data.

    Only the primary ARG query below is executed by the app. Supplemental variants, if any, are documentation-only in cost-research.json.

    Circuit configuration to join with billing and traffic evidence outside ARG; no SKU is inherently cost compliant.

    No live Azure execution or compilation was performed. Empty or truncated results do not establish compliance, realized savings or permission to change resources.

    Required scope/data: Read access to the resources/recommendations in the reviewer-selected subscriptions or management-group scope; no scope IDs are invented or embedded. For relationship/absence checks, include all relevant related resources and verify visibility before interpreting unmatched rows. Billing, utilization metrics and business/retention context must be reviewed separately to estimate net savings.

    Caveats: ARG is a scoped, eventually consistent control-plane index. Missing rows, fields, permissions or subscriptions are not evidence of compliance. Retrieve complete query results using the client's supported paging and respect ARG result/expansion limits; truncated output is not a complete inventory. Inventory identifies review candidates, not realized savings or authorization to change/delete resources. Review ownership, change windows, retention, security, availability, dependencies and current negotiated pricing before action. Local applicability depends on peering location, required destinations and topology; resource location is not a substitute. Metered versus unlimited depends on measured egress, negotiated price, port/circuit model and Global Reach. ExpressRoute Direct and provider circuits have different billing structures; not all fields are populated for both.
  resultSemantics: inventory
