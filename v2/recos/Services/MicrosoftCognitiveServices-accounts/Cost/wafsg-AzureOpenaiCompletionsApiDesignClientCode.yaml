name: wafsg-AzureOpenaiCompletionsApiDesignClientCode
title: Set model- and API-appropriate output limits in Azure OpenAI clients
description: Use the output-limit parameter supported by the selected model and API. Reasoning models
  use max_output_tokens with Responses or max_completion_tokens with Chat Completions; these budgets include
  reasoning as well as visible output. Do not assume legacy max_tokens or n is supported by every model.
  Check incomplete responses, measure token use and preserve enough budget for a useful result.
