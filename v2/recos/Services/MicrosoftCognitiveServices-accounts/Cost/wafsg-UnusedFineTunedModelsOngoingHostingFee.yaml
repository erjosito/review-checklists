name: wafsg-UnusedFineTunedModelsOngoingHostingFee
title: Retire unused fine-tuned deployments while preserving required model assets
description: Review deployed fine-tuned endpoints and their owners before cleanup. Deployed models can
  incur hosting charges while unused; removing an unneeded deployment can stop its hosting charge. Distinguish
  the deployed endpoint from retained training/model assets, preserve reproducibility and recovery requirements,
  and verify the resulting billing change.
