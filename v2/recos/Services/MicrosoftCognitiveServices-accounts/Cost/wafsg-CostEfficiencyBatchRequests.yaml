name: wafsg-CostEfficiencyBatchRequests
title: Evaluate the Azure OpenAI Batch API for delay-tolerant workloads
description: Compare supported Global or Data Zone Batch deployments with online execution when the workload
  tolerates asynchronous processing. Check model/API availability, separate enqueued-token quota and data-processing
  geography. The documented 24-hour completion window is a target, not a guarantee; cancelled jobs still
  charge for completed work. Ordinary client-side batching alone does not establish a lower token price.
