name: wafsg-PromptInputResponseLength
title: Optimize Azure OpenAI context and generated-token budgets against task quality
description: Reduce unnecessary prompt/context growth while retaining the evidence needed for a useful
  answer. Budget both visible output and reasoning tokens with the parameter supported by the API. Measure
  task quality, token use and incomplete responses before reducing limits; a smaller visible answer does
  not necessarily imply a smaller reasoning bill.
