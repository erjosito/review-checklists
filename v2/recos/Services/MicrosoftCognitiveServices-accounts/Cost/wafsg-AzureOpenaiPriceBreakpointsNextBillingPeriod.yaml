name: wafsg-AzureOpenaiPriceBreakpointsNextBillingPeriod
title: Model Azure OpenAI charges by the actual deployment and usage meters
description: Identify the model, deployment type and billing units for training, hosting and inference.
  Training can be token-based or time-based depending on the model; deployed fine-tuned models can incur
  hosting cost even when idle. Reconcile text, image and audio usage with current pricing and Cost Management
  meters. Do not assume generating 100 images costs the same as generating one, or that every fine-tuning
  job is rounded to an hourly block.
