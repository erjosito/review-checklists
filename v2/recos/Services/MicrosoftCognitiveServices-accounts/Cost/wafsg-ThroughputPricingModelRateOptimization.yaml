title: Compare provisioned Azure OpenAI capacity with observed usage and commitments
description: Evaluate provisioned throughput only after measuring sustained demand, model/deployment eligibility
  and required latency. Include reserved-capacity utilization and idle capacity in the comparison with
  usage-based billing. Review Advisor opportunities as estimates, not proof that provisioned capacity
  is always cheaper for a predictable workload.
