name: wafsg-ArchitecturalDesignDecisionsAzureOpenaiModels
title: Reconcile Azure OpenAI usage metrics with billed model and deployment meters
description: Monitor request and token usage to detect demand changes, but use matching-scope Cost Management
  meters and invoiced charges for financial reconciliation. Include input, visible output and reasoning
  tokens where applicable, hosting and other application dependencies. TPM and RPM are operational rates,
  not a complete monetary-cost calculation.
