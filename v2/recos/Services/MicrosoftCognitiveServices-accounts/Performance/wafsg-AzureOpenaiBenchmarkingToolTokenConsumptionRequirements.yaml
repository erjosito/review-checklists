name: wafsg-AzureOpenaiBenchmarkingToolTokenConsumptionRequirements
title: Benchmark Azure OpenAI capacity with representative token and request distributions
description: Measure input and output tokens, request rate, concurrency, prompt-cache behavior and latency
  for the selected model/version. Use observed workload distributions and the capacity calculator when
  sizing provisioned deployments, then load test. Standard TPM quota governs admission and is not a guarantee
  of achieved throughput. ARG deployment inventory cannot establish these measurements.
