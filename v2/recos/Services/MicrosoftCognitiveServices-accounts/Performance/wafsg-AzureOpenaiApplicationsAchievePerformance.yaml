name: wafsg-AzureOpenaiApplicationsAchievePerformance
title: Use streaming when incremental Azure OpenAI responses improve user experience
description: For interactive applications, measure time to first token, time between tokens and total
  response time. Streaming exposes tokens as they become available; it does not guarantee a shorter time
  to generate the complete answer. Check intermediary buffering and client timeouts using representative
  requests.
