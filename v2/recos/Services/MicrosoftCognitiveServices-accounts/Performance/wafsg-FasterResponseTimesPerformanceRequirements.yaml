name: wafsg-FasterResponseTimesPerformanceRequirements
title: Select an Azure OpenAI model using measured latency and output-quality targets
description: Compare eligible models and versions with representative prompts, output lengths and concurrent
  traffic. Measure first-token and completion latency together with quality. Do not assume a model name
  or quota alone proves the workload meets its performance targets.
