name: wafsg-CustomGatewayImplementationTpmDeployment
title: Evaluate native spillover for bursts beyond Azure OpenAI provisioned capacity
description: Size provisioned throughput for the measured baseline. For suitable workloads, configure
  native spillover to a standard deployment in the same Foundry resource with a matching model and version,
  instead of assuming a custom gateway is always required. Verify current deployment/model eligibility
  and quota. Test spillover failures and additional latency; standard traffic is token-billed and may
  also be throttled. Monitor deployment-level requests, tokens, status codes and spillover indicators.
