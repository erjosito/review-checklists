name: wafsg-DedicatedModelDeploymentsModelUsageIsolation
title: Separate Azure OpenAI deployments where workload interference affects latency
description: Benchmark consumer/workload isolation when mixing long and short requests or competing prompt-cache
  usage degrades latency. Separate deployments can reduce interference, but do not by themselves establish
  dedicated physical hardware or an end-to-end latency guarantee. Balance isolation against capacity utilization
  and cost.
