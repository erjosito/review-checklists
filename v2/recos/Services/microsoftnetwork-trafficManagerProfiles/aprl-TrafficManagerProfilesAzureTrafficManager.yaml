name: aprl-TrafficManagerProfilesAzureTrafficManager
title: Traffic manager profiles should have more than one endpoint
description: When configuring the Azure traffic manager, provision at least two endpoints to ensure workloads
  can fail-over to another instance, enhancing reliability and availability.
source:
