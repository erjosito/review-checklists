name: aprl-AzureLoadBalancersBackendInstancesAvailability
title: Use Health Probes to detect backend instances availability
description: Health probes are used by Azure Load Balancers to determine the status of backend endpoints.
  Using custom health probes that are aligned with vendor recommendations enhances understanding of backend
  availability and facilitates monitoring of backend services for any impact.
source:
  type: aprl
  file: azure-resources/Network/loadBalancers/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
