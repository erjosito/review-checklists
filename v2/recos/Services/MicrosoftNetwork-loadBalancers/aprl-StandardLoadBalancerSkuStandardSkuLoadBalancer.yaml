name: aprl-StandardLoadBalancerSkuStandardSkuLoadBalancer
title: Use Standard Load Balancer and design its frontend and backend resilience
description: Use Standard Load Balancer with zone-redundant frontend IP configurations where available
  and distribute backend instances across availability zones. Frontend redundancy does not make single-zone
  backends resilient, and a regional load balancer does not itself protect against a region-wide outage.
  Design separate regional deployments and an appropriate global traffic-routing or global load-balancer
  solution when regional failover is required.
