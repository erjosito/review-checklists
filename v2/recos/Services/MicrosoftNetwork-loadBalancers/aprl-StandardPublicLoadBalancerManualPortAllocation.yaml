name: aprl-StandardPublicLoadBalancerManualPortAllocation
title: Use NAT Gateway instead of Outbound Rules for Production Workloads
description: Outbound rules for Standard Public Load Balancer involve manual port allocation for backend
  pools, limiting scalability and risk of SNAT port exhaustion. NAT Gateway is recommended for its dynamic
  scaling and secure internet connectivity.
