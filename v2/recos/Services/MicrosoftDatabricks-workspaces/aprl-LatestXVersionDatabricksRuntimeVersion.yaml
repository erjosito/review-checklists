name: aprl-LatestXVersionDatabricksRuntimeVersion
title: Run Databricks workloads on supported runtime versions and plan LTS upgrades
description: Check each workload's Databricks Runtime against the current supported-release and end-of-support
  table. Prefer an appropriate supported LTS release for workloads that need long-term support, and test
  Spark, library, MLflow, and feature compatibility before upgrading. Do not follow the obsolete fixed
  migration path through Runtime 11.3 and 12.x; select a currently supported target. Serverless compute
  uses Databricks-managed runtime versions and has separate release guidance.
