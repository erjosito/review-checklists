name: aprl-ResilientDistributedDataProcessingUsePhotonAcceleration
title: Use resilient distributed execution for Databricks SQL and DataFrame workloads
description: Use Databricks' resilient distributed processing for SQL and Spark DataFrame workloads, and
  account for its task-recovery behavior in the workload design. Spark can reschedule missing or failed
  tasks after transient infrastructure faults such as a brief network interruption or a revoked Spot VM;
  this is not a guarantee that every job or dependency will recover. Photon is a compatible query-acceleration
  engine and should be evaluated separately for supported operations and performance needs, not treated
  as the switch that enables Spark task recovery. Job-level retries, streaming checkpoints and regional
  recovery remain separate controls.
