name: aprl-TheDatabricksLabsProjectDatabricksCliApi
title: Create regular backups
description: To recover from a failure, regular backups are needed. The Databricks Labs project migrate
  lets admins create backups by exporting workspace assets using the Databricks CLI/API. These backups
  help in restoring or migrating workspaces.
