name: aprl-SqlWarehouseScalingParameter
title: Enable autoscaling for SQL warehouse
description: The scaling parameter of a SQL warehouse defines the min and max number of clusters for distributing
  queries. By default, it's set to one. Increasing the cluster count can accommodate more concurrent users
  effectively.
