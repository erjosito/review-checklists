name: aprl-CriticalProductionWorkloadsAzureSpotVms
title: Do not use Azure Spot VMs for critical Production workloads
description: Azure Spot VMs are not suitable for critical production workloads needing high availability
  and reliability. They are meant for fault-tolerant tasks and can be evicted with 30-seconds notice if
  Azure needs the capacity, with no SLA guarantees.
