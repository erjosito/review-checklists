name: aprl-EfficientErrorRecoveryDatabricksWorkflows
title: Use Databricks Workflows and built-in recovery
description: Databricks Workflows enable efficient error recovery in multi-task jobs by offering a matrix
  view for issue examination. Fixes can be applied to initiate repair runs targeting only failed and dependent
  tasks, preserving successful outcomes and thereby saving time and money.
