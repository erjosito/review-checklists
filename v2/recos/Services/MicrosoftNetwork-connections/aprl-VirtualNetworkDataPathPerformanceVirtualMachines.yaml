name: aprl-VirtualNetworkDataPathPerformanceVirtualMachines
title: For better data path performance enable FastPath on ExpressRoute Connections
description: ExpressRoute gateways facilitate network traffic and route exchanges. FastPath enhances on-premises
  to virtual network data path performance by directing traffic straight to virtual machines, bypassing
  the gateway for improved resiliency through reduced gateway utilization.
