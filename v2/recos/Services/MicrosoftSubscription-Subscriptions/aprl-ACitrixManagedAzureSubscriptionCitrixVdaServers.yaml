name: aprl-ACitrixManagedAzureSubscriptionCitrixVdaServers
title: Do not create more than 2000 Citrix VDA servers per subscription
description: A Citrix Managed Azure subscription supports VMs with VDA for app/desktop delivery, excluding
  other machines like Cloud Connectors. When close to the limit, signaled by a dashboard notification,
  and with sufficient licenses, request another subscription. Can't exceed the given limits for catalogs.
