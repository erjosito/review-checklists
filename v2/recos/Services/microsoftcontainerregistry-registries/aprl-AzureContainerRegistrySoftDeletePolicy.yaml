name: aprl-AzureContainerRegistrySoftDeletePolicy
title: Enable soft delete policy
description: Enabling soft delete preview feature in Azure Container Registry (ACR) allows for the management
  of deleted artifacts with a specified retention period. Users can list, filter, and restore these artifacts
  until automatically purged post-retention.
source:
  type: aprl
  file: azure-resources/ContainerRegistry/registries/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
