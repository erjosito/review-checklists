name: aprl-AzureContainerRegistryCriticalProductionWorkloads
title: Use Premium tier for critical production workloads
description: Choose a service tier of Azure Container Registry to meet your performance needs. Premium
  offers the most bandwidth and highest rate of read and write operations for high-volume deployments.
  Use Basic to start, Standard for production, and Premium for hyper-scale performance and geo-replication.
