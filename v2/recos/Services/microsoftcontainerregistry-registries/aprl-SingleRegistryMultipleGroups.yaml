name: aprl-SingleRegistryMultipleGroups
title: Use Repository namespaces
description: Using repository namespaces allows a single registry to be shared across multiple groups
  and deployments within an organization, supporting nested namespaces for group isolation. However, repositories
  are managed independently, not hierarchically.
