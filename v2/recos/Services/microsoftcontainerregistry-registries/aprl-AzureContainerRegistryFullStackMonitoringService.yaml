name: aprl-AzureContainerRegistryFullStackMonitoringService
title: Monitor Azure Container Registry with Azure Monitor
description: Use Azure Monitor to analyze Azure Container Registry metrics and logs and configure actionable
  alerts. Platform metrics and the Activity log are collected automatically; resource logs require diagnostic
  settings and a destination. Review registry usage, push/pull activity, failures, and resource-specific
  metrics. Azure Container Registry produces the telemetry; Azure Monitor is the monitoring service.
