name: aprl-FlexibleServerInstancesAutomaticFailoverCapability
title: Enable HA with zone redundancy
description: Enable HA with zone redundancy on flexible server instances to deploy a standby replica in
  a different zone, offering automatic failover capability for improved reliability and disaster recovery.
