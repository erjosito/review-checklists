name: aprl-AzureDdosStandardProtectionPlansApplicationDesignBestPractices
title: Shield public endpoints in Azure VNets with Azure DDoS Standard Protection Plans
description: Azure DDoS Protection offers enhanced mitigation features against DDoS attacks and is auto-tuned
  to protect specific resources in a virtual network, combined with application design best practices.
