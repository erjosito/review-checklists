description: Review Advisor opportunities, billed ingestion by table, retention and query frequency. Compare
  suitable table plans, commitment tiers and long-term retention against alert/query requirements. Investigate
  ingestion anomalies and remove restored data only when no longer required. Treat daily caps as a last-resort
  protection with early alerts, not a routine cost-reduction method, because caps interrupt collection.
