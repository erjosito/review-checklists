description: Identify top billable tables and sources, then reduce unneeded collection at source or through
  supported ingestion-time transformations. Check duplicated collection across agents and workspaces.
  Retain data needed for security, reliability, auditing and incident response, and measure the resulting
  billable ingestion rather than assuming every filter saves cost.
