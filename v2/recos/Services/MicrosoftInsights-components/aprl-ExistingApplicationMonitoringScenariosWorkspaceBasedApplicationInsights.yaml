name: aprl-ExistingApplicationMonitoringScenariosWorkspaceBasedApplicationInsights
title: Verify Application Insights uses a workspace-based resource
description: Verify the Application Insights resource is workspace-based and linked to the intended Log
  Analytics workspace. For any remaining classic migration, review retention, permissions, data-export
  integrations, and the documented irreversible migration behavior. New telemetry is written to the workspace
  after migration; classic historical data is not copied into it. The linked migration article is archived
  historical guidance, not proof that an old retirement deadline is still in the future.
