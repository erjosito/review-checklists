name: aprl-AzureEventGridTopicsPrivateLinkPrivateEndpoints
title: Azure Event Grid topics should use Private Link Private Endpoints
description: Use private endpoints for secure event ingress to custom topics/domains via a private link,
  avoiding the public internet. It employs an IP from the VNet space for your topic/domain.
source:
