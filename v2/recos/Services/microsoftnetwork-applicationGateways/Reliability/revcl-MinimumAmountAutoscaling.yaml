description: 'Configure autoscaling maximum capacity for peak traffic and redistribution after zone loss,
  and choose minimum provisioned capacity from workload needs. The platform internally maintains at least
  two instances for high availability, even when displayed configured capacity differs; a configured autoscale
  minimum alone does not measure runtime instance count. Monitor capacity and test backend and gateway
  capacity under failure. The ARG query inventories reported configuration only. An omitted zone list
  is not evidence of nonredundancy: current v2 gateways default to zone redundancy in supported regions
  unless pinned to one zone. Null/missing properties, incomplete scope or zero rows do not establish compliance.
  Verify deployment behavior, capacity under failure and backend health separately; no live query validation
  is recorded.'
