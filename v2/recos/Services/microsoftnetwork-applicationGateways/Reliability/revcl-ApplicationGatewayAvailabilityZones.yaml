      compliance.
description: 'Use Standard_v2 or WAF_v2 in a supported region. New gateways are zone redundant by default;
  omit the zone list to allow all zones unless a specific exclusion is required. Pinning to one zone does
  not protect against that zone failing; if required for latency, deploy separate gateways and tested
  routing across zones. Ensure backend services are also resilient. The ARG query inventories reported
  configuration only. An omitted zone list is not evidence of nonredundancy: current v2 gateways default
  to zone redundancy in supported regions unless pinned to one zone. Null/missing properties, incomplete
  scope or zero rows do not establish compliance. Verify deployment behavior, capacity under failure and
  backend health separately; no live query validation is recorded.'
