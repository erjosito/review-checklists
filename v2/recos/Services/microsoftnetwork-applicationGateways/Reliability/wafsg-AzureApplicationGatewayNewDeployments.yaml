name: wafsg-AzureApplicationGatewayNewDeployments
title: Migrate remaining Application Gateway v1 deployments to v2
description: Application Gateway v1 retired on April 28, 2026. Remaining v1 resources are unsupported,
  have no SLA and can experience traffic disruption as the service is decommissioned. Use v2 for new deployments
  and plan/test migration of remaining v1 gateways, including routing, certificates, backend health and
  rollback arrangements before changing traffic.
