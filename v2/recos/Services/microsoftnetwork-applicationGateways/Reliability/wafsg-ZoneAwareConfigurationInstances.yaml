name: wafsg-ZoneAwareConfigurationInstances
title: Verify Application Gateway v2 zone redundancy rather than assuming an explicit zone list is required
description: In supported regions, Standard_v2 and WAF_v2 gateways are zone redundant by default unless
  configured as single-zone deployments. Prefer the default zone-redundant configuration; a single-zone
  deployment requires separate gateways and failover to survive a zone outage. Review backend redundancy
  and spare capacity as part of the end-to-end design.
