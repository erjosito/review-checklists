description: Use a short, controlled Detection period with diagnostic logs to identify false positives,
  then enable Prevention and review exclusions and custom-rule actions. Verify effective policy associations
  at gateway, listener and path scope, and test that protected requests traverse the WAF. Detection mode
  logs without blocking. A query over Front Door WAF resources cannot assess Application Gateway WAF,
  and a mode flag alone cannot prove effective protection.
