name: wafsg-EasierCertificateRenewalAzureKeyVault
title: Use Azure Key Vault certificates for Application Gateway v2 HTTPS listeners.
description: Use an enabled software-backed PFX certificate with an exportable private key, and reference
  its Key Vault secret through a user-assigned managed identity with the required secret-read permission.
  Prefer a versionless secret identifier so Application Gateway can retrieve renewed versions during its
  four-hour polling cycle. Verify Key Vault network reachability and monitor access failures, because
  loss of certificate access can disable the listener. HSM-backed certificates are not supported by this
  integration.
