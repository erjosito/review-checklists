name: aprl-ApplicationGatewaySubnetWafVSku
title: A minimum subnet size of /24 is recommended for Application Gateway v2 subnets.
description: Application Gateway (Standard_v2 or WAF_v2 SKU) can support up to 125 instances (125 instance
  IP addresses + 1 private frontend IP configuration + 5 Azure reserved). A minimum subnet size of /24
  is recommended.
