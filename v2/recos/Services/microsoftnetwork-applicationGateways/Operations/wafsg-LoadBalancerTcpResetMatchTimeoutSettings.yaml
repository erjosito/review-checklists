name: wafsg-LoadBalancerTcpResetMatchTimeoutSettings
title: Match timeout settings with the backend application
description: Identify the Application Gateway setting relevant to the protocol and traffic pattern instead
  of applying Azure Load Balancer idle-timeout limits. For planned backend removal, configure connection
  draining to accommodate expected transfers and account for affinity and long-running connections. Validate
  HTTP request timeout, backend behavior and deployment recovery against current Application Gateway documentation.
  The previous four-minute/default and thirty-minute/maximum Load Balancer statement did not establish
  Application Gateway limits.
