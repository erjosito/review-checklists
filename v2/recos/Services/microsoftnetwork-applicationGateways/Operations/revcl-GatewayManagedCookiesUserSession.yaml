description: Enable gateway-managed cookie affinity only when the application requires session stickiness
  and clients support cookies. Test cross-origin HTTPS behavior and the impact on traffic distribution
  and connection draining. Affinity is routing behavior, not a substitute for application recovery or
  durable session-state design.
