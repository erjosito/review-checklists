name: wafsg-ApplicationGatewayInstancesEmptyBackendPools
title: Review Application Gateways with no configured backend targets
description: Identify gateways with no visible backend targets and verify provisioning state, traffic,
  ownership, automation and approved standby plans. Remove only confirmed unnecessary instances through
  controlled change. Empty or missing backend metadata is a candidate signal, not proof of waste or authority
  to delete.
source:
  type: wafsg
  file: ./checklists-ext/wafsg_checklist.en.json
resourceTypes:
- microsoft.network/applicationgateways
waf: Cost
severity: 1
labels:
  guid: 7947e534-c9a8-435b-9e03-d300143b5f74
links: []
queries:
  arg: |-
    Resources
    | where type =~ 'microsoft.network/applicationgateways'
    | project id, name, subscriptionId, resourceGroup, location, sku
    | join kind=leftouter (
        Resources
        | where type =~ 'microsoft.network/applicationgateways'
        | mv-expand pool = properties.backendAddressPools limit 2000
        | extend ipCount = array_length(pool.properties.backendIPConfigurations),
            addressCount = array_length(pool.properties.backendAddresses)
        | summarize backendTargets = sum(coalesce(ipCount, 0) + coalesce(addressCount, 0)) by id
    ) on id
    | where coalesce(backendTargets, 0) == 0
    | project id, name, subscriptionId, resourceGroup, location, sku, backendTargets
schemaVersion: 1
