name: wafsg-ApplicationGatewayInstancesExtraneousCosts
title: Stop Application Gateway instances when not in use
description: You aren't billed when Application Gateway is in the stopped state. Continuously running
  Application Gateway instances can incur extraneous costs. Evaluate usage patterns and stop instances
  when you don't need them. For example, usage after business hours in Dev/Test environments is expected
  to be low.See these articles for information about how to stop and start instances.- Stop-AzApplicationGateway-
  Start-AzApplicationGateway
