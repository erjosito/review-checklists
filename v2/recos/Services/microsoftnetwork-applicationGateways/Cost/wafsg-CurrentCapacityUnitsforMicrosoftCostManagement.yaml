name: wafsg-CurrentCapacityUnitsforMicrosoftCostManagement
title: Review consumption metrics across different parameters
description: You're billed based on metered instances of Application Gateway based on the metrics tracked
  by Azure. Evaluate the various metrics and capacity units and determine the cost drivers. For more information,
  see Microsoft Cost Management and Billing. The following metrics are key for Application Gateway. This
  information can be used to validate that the provisioned instance count matches the amount of incoming
  traffic.- Estimated Billed Capacity Units- Fixed Billable Capacity Units- Current Capacity UnitsFor
  more information, see Application Gateway metrics.Make sure you account for bandwidth costs.
