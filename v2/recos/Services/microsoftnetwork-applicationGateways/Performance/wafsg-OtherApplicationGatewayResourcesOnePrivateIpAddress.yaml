name: wafsg-OtherApplicationGatewayResourcesOnePrivateIpAddress
title: Size the Application Gateway v2 subnet for peak instance capacity
description: A /24 is the documented recommendation for v2 deployments. Account for one private IP per
  instance, a private frontend if configured, five Azure-reserved addresses, and every other gateway sharing
  the subnet at maximum scale. Application Gateway v1 retired on 2026-04-28; do not plan new capacity
  around its historical limits or assume mixed-version deployment is supported.
