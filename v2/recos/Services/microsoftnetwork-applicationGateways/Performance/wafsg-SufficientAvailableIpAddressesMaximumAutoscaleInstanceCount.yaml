name: wafsg-SufficientAvailableIpAddressesMaximumAutoscaleInstanceCount
title: Set Application Gateway v2 maximum capacity with subnet and budget headroom
description: The service guide recommends allowing scale-out up to the supported maximum of 125 instances,
  with sufficient subnet IPs. Check current service limits and workload needs. Raising a configured maximum
  does not itself allocate all instances, but capacity actually consumed is billable; review cost and
  service limits before permitting large scale-out.
