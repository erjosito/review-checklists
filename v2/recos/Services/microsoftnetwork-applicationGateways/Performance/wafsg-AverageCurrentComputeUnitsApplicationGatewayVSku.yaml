name: wafsg-AverageCurrentComputeUnitsApplicationGatewayVSku
title: Set Application Gateway v2 minimum capacity from observed traffic and startup delay
description: Review compute units and traffic patterns over a representative period, including bursts.
  The current service guide describes roughly three to five minutes for extra instances to serve traffic;
  do not treat that estimate as a guaranteed bound. Maintain sufficient minimum capacity for demand while
  scale-out completes, and verify with load testing rather than relying on an ambiguous average-versus-peak
  formula.
