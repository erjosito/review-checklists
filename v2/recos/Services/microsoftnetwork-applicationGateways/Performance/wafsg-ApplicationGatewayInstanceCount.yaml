name: wafsg-ApplicationGatewayInstanceCount
title: Estimate Application Gateway v2 capacity using traffic and compute measurements
description: Use current compute units, throughput, connections and representative payloads to estimate
  instances; the documented approximate per-instance capacities are planning inputs, not guarantees. Compare
  estimates with measured peak traffic, autoscaling delays, configured limits and subnet headroom. Maintain
  a buffer for bursts and validate with load tests.
