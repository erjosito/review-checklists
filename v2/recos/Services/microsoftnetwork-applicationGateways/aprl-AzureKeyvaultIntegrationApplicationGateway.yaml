name: aprl-AzureKeyvaultIntegrationApplicationGateway
title: Migrate any remaining Application Gateway v1 deployments to v2
description: Application Gateway v1 retired on April 28, 2026 and no longer has support or an SLA. Migrate
  any remaining v1 deployment to v2 immediately, validating configuration, backend connectivity, and traffic
  cutover. Continued v1 traffic is not guaranteed during retirement decommissioning; do not retain an
  exception that treats v1 as a supported choice when v1-specific functionality is desired.
