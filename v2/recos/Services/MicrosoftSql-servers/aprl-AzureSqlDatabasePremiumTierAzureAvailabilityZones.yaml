name: aprl-AzureSqlDatabasePremiumTierAzureAvailabilityZones
title: Enable zone redundancy for supported Azure SQL Database tiers
description: Enable zone redundancy where supported by the database tier and region. It protects against
  an availability-zone failure within a region, not a region-wide outage. Supported tiers include vCore
  General Purpose, Business Critical, and Hyperscale and DTU Premium, but not DTU Basic or Standard. Evaluate
  active geo-replication, failover groups, or geo-restore separately for regional recovery. An inventory
  of zoneRedundant=false databases still needs tier and region eligibility review before remediation.
