name: aprl-AzureSqlDatabaseDatabaseLayerConfiguration
title: Implement Retry Logic
description: During transient failures, the application should handle connection retries effectively with
  Azure SQL Database. No Database layer configuration is needed; instead, the application must be set
  up for graceful retrying.
