  url: https://learn.microsoft.com/cloud-computing/finops/best-practices/databases
title: Review empty Azure SQL elastic pools for approved retirement
description: Identify pools with no visible member databases, confirm complete permissions and current
  ARM state, and ask the owner whether the pool is staged for approved demand. Retire only confirmed unnecessary
  pools with change approval; no-membership evidence is not a utilization history or permission to delete.
waf: Cost
severity: 1
services:
- Azure SQL Database
resourceTypes:
- microsoft.sql/servers/elasticpools
automation:
  status: query_available
  validatedAt: null
  notes: |-
    Documented ARG inventory/Advisor query available but unvalidated; financial and operational judgment remains mandatory.

    Only the primary ARG query below is executed by the app. Supplemental variants, if any, are documentation-only in cost-research.json.

    Elastic pools without a database membership row visible in the same query scope.

    No live Azure execution or compilation was performed. Empty or truncated results do not establish compliance, realized savings or permission to change resources.

    Required scope/data: Read access to the resources/recommendations in the reviewer-selected subscriptions or management-group scope; no scope IDs are invented or embedded. For relationship/absence checks, include all relevant related resources and verify visibility before interpreting unmatched rows. Billing, utilization metrics and business/retention context must be reviewed separately to estimate net savings.

    Caveats: ARG is a scoped, eventually consistent control-plane index. Missing rows, fields, permissions or subscriptions are not evidence of compliance. Retrieve complete query results using the client's supported paging and respect ARG result/expansion limits; truncated output is not a complete inventory. Inventory identifies review candidates, not realized savings or authorization to change/delete resources. Review ownership, change windows, retention, security, availability, dependencies and current negotiated pricing before action. A just-created or intentionally staged pool can legitimately be empty. Ensure databases are visible with complete permissions and fresh metadata.
  resultSemantics: inventory
queries:
  arg: |-
    Resources
    | where type =~ 'microsoft.sql/servers/elasticpools'
    | extend poolId = tolower(id)
    | project id, name, subscriptionId, resourceGroup, location, sku, poolId
    | join kind=leftouter (
        Resources
        | where type =~ 'microsoft.sql/servers/databases'
        | extend poolId = tolower(tostring(properties.elasticPoolId))
        | where isnotempty(poolId)
        | summarize databaseCount = count() by poolId
    ) on poolId
    | where isnull(databaseCount)
    | project id, name, subscriptionId, resourceGroup, location, sku
