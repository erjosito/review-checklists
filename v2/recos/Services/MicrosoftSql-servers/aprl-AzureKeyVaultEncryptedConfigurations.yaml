name: aprl-AzureKeyVaultEncryptedConfigurations
title: Back Up Your Keys
description: It is highly recommended to use Azure Key Vault (AKV) to store encryption keys related to
  Always Encrypted configurations, however it is not required. If you are not using AKV, then ensure that
  your keys are properly backed up and stored in a secure manner.
