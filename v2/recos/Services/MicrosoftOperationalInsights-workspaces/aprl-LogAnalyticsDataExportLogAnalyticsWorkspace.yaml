name: aprl-LogAnalyticsDataExportLogAnalyticsWorkspace
title: Enable Log Analytics data export to GRS or GZRS
description: Data export in a Log Analytics workspace to an Azure Storage account enhances data protection
  against regional failures by using geo-redundant (GRS) or geo-zone-redundant storage (GZRS), mainly
  for compliance and integration with other Azure services and tools.
