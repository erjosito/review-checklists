name: aprl-MissionCriticalWorkloadsFailoverRegionIotHub
title: Device Identities are exported to a secondary region
description: Device Identities should be copied to the failover region IoT Hub for all IoT devices to
  ensure connectivity in case of a failover. Manual Failover to another region is quicker (RTO), suitable
  for mission critical workloads.
