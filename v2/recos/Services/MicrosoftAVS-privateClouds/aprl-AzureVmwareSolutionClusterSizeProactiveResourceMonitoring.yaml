name: aprl-AzureVmwareSolutionClusterSizeProactiveResourceMonitoring
title: Monitor when Azure VMware Solution Cluster Size is approaching the host limit
description: Alert when the cluster size reaches 14 hosts. Set up periodic alerts for planning new clusters
  or datastores due to growth, especially from storage needs. Beyond 14 hosts, trigger alerts for each
  new host addition for proactive resource monitoring.
