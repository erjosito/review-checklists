description: Include AVS guest workloads in a supported patch-management process. Where Azure management
  is selected, assess Azure Update Manager and its Azure Arc prerequisites for the guest OS, schedule
  patching, verify assessment and installation results, and define emergency patch handling. Azure Update
  Manager is separate from Azure Monitor Agent; migrating monitoring does not migrate patch management.
