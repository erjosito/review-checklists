description: For supported Azure VMware Solution guest operating systems, onboard non-Azure servers with
  Azure Arc as required, then deploy Azure Monitor Agent with the intended data collection rules. The
  Log Analytics agent retired on August 31, 2024 and ingestion can stop after March 2, 2026. Pilot the
  migration, confirm expected telemetry and dependent services, avoid duplicate collection and remove
  legacy workspace collection after validation. Preserve any separately required on-premises SCOM configuration.
