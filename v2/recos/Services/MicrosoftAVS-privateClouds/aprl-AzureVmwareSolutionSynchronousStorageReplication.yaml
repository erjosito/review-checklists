name: aprl-AzureVmwareSolutionSynchronousStorageReplication
title: Enable Stretched Clusters for Multi-AZ Availability of the vSAN Datastore
description: For Azure VMware Solution, enabling Stretched Clusters offers 99.99% SLA, synchronous storage
  replication (RPO=0), and spreads vSAN datastore across two AZs. Must be done at initial setup, needing
  double quota due to extension across AZs.
