description: When pipeline recovery objectives require surviving a regional outage, prepare replacement
  or recoverable self-hosted integration runtime compute and its network, identity and data-source dependencies
  in the recovery region. Microsoft-managed Data Factory failover does not recover customer-managed SHIR
  hosts. For SHIR hosted on Azure VMs, evaluate Azure Site Recovery or a tested redeployment approach;
  VM replication is an option, not a universal requirement. Verify host registration, connectivity and
  capacity before relying on the recovery path.
