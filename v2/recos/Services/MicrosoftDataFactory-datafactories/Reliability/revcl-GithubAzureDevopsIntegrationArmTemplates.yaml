description: Use Azure Repos or GitHub integration on the development data factory to retain reviewed
  pipeline, dataset, linked-service and trigger definitions, and use CI/CD to deploy tested artifacts
  to recovery, test and production factories. Retain the factory infrastructure definition and account
  for deployment parameters, secrets and dependencies separately. Verify that the recorded artifacts can
  restore the intended configuration; Git integration is not a backup of the data being processed or of
  changes made directly outside Git.
