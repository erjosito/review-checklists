description: In regions that support availability zones, the Data Factory core service and Azure integration
  runtime provide Microsoft-managed zone redundancy without a pipeline setting. For Azure-SSIS IR, use
  at least two nodes for automatic distribution across zones; for SHIR, provide customer-managed resilient
  compute across zones. Account for dependent data stores and the documented tumbling-window trigger-state
  caveat, and design retried activities to be idempotent. Do not interpret a factory's region alone as
  proof that every pipeline dependency is zone-resilient.
