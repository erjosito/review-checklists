name: revcl-AdfPipelinesKeyVault
title: Include Key Vault dependencies in the availability and recovery design for Data Factory v2 pipelines
description: For Data Factory v2 pipelines that retrieve linked-service credentials from Key Vault, assess
  vault availability, regional recovery behavior, identity permissions and network reachability against
  the pipeline's recovery objectives. Key Vault provides managed redundancy, but cross-region replication
  and Microsoft-managed failover have regional exceptions and can be delayed; they do not guarantee coordinated
  recovery with Data Factory. Document and test the required secret-access and dependency recovery approach
  instead of assuming no customer action is needed.
