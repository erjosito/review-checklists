description: For a Data Factory v2 regional recovery design, document and recreate the networking needed
  by the selected integration runtimes and data dependencies, including applicable virtual networks, routes,
  name resolution and private connectivity. Validate connectivity to recovered data stores, Key Vault
  and SHIR hosts. Select the recovery region according to recovery objectives, service support and data-residency
  constraints; do not assume every factory has an appropriate paired region or that duplicating a virtual
  network alone restores pipeline operation.
