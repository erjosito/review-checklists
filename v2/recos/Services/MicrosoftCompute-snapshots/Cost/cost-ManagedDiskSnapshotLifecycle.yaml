title: Review managed disk snapshot tier and retention against recovery needs
description: Inventory Premium and aged managed disk snapshots. Evaluate Standard storage where suitable,
  and align retention with recovery, audit and legal requirements. Treat age as a review signal, not an
  automatic deletion rule. Include temporary migration copies and remaining backup/snapshot cost when
  estimating savings.
waf: Cost
severity: 1
services:
- Azure Managed Disks
resourceTypes:
- microsoft.compute/snapshots
automation:
  status: query_available
  validatedAt: null
  notes: |-
    Documented ARG inventory/Advisor query available but unvalidated; financial and operational judgment remains mandatory.

    Only the primary ARG query below is executed by the app. Supplemental variants, if any, are documentation-only in cost-research.json.

    Premium snapshots for Standard-storage migration review.

    No live Azure execution or compilation was performed. Empty or truncated results do not establish compliance, realized savings or permission to change resources.

    Required scope/data: Read access to the resources/recommendations in the reviewer-selected subscriptions or management-group scope; no scope IDs are invented or embedded. For relationship/absence checks, include all relevant related resources and verify visibility before interpreting unmatched rows. Billing, utilization metrics and business/retention context must be reviewed separately to estimate net savings.

    Caveats: ARG is a scoped, eventually consistent control-plane index. Missing rows, fields, permissions or subscriptions are not evidence of compliance. Retrieve complete query results using the client's supported paging and respect ARG result/expansion limits; truncated output is not a complete inventory. Inventory identifies review candidates, not realized savings or authorization to change/delete resources. Review ownership, change windows, retention, security, availability, dependencies and current negotiated pricing before action. Premium tier alone does not establish a safe migration or net savings; preserve required recovery points and account for temporary copies and migration cost.
  resultSemantics: inventory
queries:
  arg: |-
    Resources
    | where type =~ 'microsoft.compute/snapshots'
    | where sku.tier =~ 'Premium'
    | project id, name, subscriptionId, resourceGroup, location,
        skuName = tostring(sku.name), diskSizeGB = tolong(properties.diskSizeGB),
        timeCreated = todatetime(properties.timeCreated)
