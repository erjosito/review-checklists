name: aprl-AzureNetappFilesAvailabilityZoneAzVolumePlacementFeature
title: Deploy ANF volumes in the same availability zone with Azure compute and other services
description: Azure NetApp Files' availability zone (AZ) volume placement feature lets you deploy volumes
  in the same AZ with Azure compute and other services to have within AZ latency and share the same AZ
  failure domain.
