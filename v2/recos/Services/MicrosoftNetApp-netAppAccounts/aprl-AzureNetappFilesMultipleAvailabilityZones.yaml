name: aprl-AzureNetappFilesMultipleAvailabilityZones
title: Use availability zones for high availability in Azure NetApp Files
description: Availability zones are distinct locations within an Azure region to withstand local failures.
  Deploy your workload in multiple availability zones and use application-based replication or Azure NetApp
  Files cross-zone replication to achieve high availability. Note that failover is a manual process.
