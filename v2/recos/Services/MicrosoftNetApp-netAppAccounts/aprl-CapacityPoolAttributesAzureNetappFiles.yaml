name: aprl-CapacityPoolAttributesAzureNetappFiles
title: Use the correct service level and volume quota size for the expected performance level
description: 'Service levels, part of capacity pool attributes, determine the maximum throughput per volume
  quota in Azure NetApp Files. It combines read and write speed, offering three levels: Standard (16 MiB/s
  per 1TiB), Premium (64 MiB/s per 1TiB), and Ultra (128 MiB/s per 1TiB) throughput.'
