name: aprl-AzureNetappFilesVolumesDifferentAvailabilityZones
title: Enable Cross-zone replication of Azure NetApp Files volumes
description: The cross-zone replication (CZR) feature enables asynchronous data replication between Azure
  NetApp Files volumes across different availability zones, ensuring data protection and critical application
  failover in case of zone-wide disasters. Note that failover is a manual process.
source:
  type: aprl
  file: azure-resources/NetApp/netAppAccounts/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
- microsoft.netapp/netappaccounts
severity: 0
labels:
  guid: e3d742e1-dacd-9b48-b6b1-510ec9f87c96
  area: Disaster Recovery
links: []
queries:
  arg: |
    // Azure Resource Graph Query
    // This Resource Graph query will return all Azure NetApp Files volumes without cross-zone replication.
    resources
    | where type == "microsoft.netapp/netappaccounts/capacitypools/volumes"
    | extend remoteVolumeRegion = properties.dataProtection.replication.remoteVolumeRegion
    | extend volumeType = properties.volumeType
    | extend replicationType = iff((remoteVolumeRegion == location), "CZR", iff((remoteVolumeRegion == ""),"n/a","CRR"))
    | where replicationType != "CZR" and volumeType != "DataProtection"
    | project recommendationId = "e3d742e1-dacd-9b48-b6b1-510ec9f87c96", name, id, tags
