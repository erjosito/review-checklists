name: aprl-SmbContinuousAvailabilitySmbTransparentFailover
title: Make use of SMB continuous availability for supported applications
description: Certain SMB applications need SMB Transparent Failover for maintenance without interrupting
  server connectivity. Azure NetApp Files provides this through SMB Continuous Availability for applications
  like Citrix App Layering, FSLogix user/profile containers, Microsoft SQL Server, MSIX app attach.
