name: aprl-StandardNetworkFeaturesAzureNetappFiles
title: Use standard network features for production in Azure NetApp Files
description: Standard network feature in Azure NetApp Files enhances IP limits and VNet capabilities,
  including network security groups, user-defined routes on subnets, and diverse connectivity options.
