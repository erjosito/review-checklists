name: aprl-AzureNetappFilesReplicationAzureNetappFilesVolumes
title: Enable Cross-region replication of Azure NetApp Files volumes
description: Azure NetApp Files replication offers data protection by allowing asynchronous cross-region
  volume replication for application failover in case of regional outages. Volumes can be replicated across
  regions, not concurrently with cross-zone replication. Note that failover is a manual process.
source:
  type: aprl
  file: azure-resources/NetApp/netAppAccounts/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
- microsoft.netapp/netappaccounts
severity: 0
labels:
  guid: e30317d2-c502-4dfe-a2d3-0a737cc79545
  area: Disaster Recovery
links: []
queries:
  arg: |
    // Azure Resource Graph Query
    // This Resource Graph query will return all Azure NetApp Files volumes without cross-region replication.
    resources
    | where type == "microsoft.netapp/netappaccounts/capacitypools/volumes"
    | extend remoteVolumeRegion = properties.dataProtection.replication.remoteVolumeRegion
    | extend volumeType = properties.volumeType
    | extend replicationType = iff((remoteVolumeRegion == location), "CZR", iff((remoteVolumeRegion == ""),"n/a","CRR"))
    | where replicationType != "CRR" and volumeType != "DataProtection"
    | project recommendationId = "e30317d2-c502-4dfe-a2d3-0a737cc79545", name, id, tags
