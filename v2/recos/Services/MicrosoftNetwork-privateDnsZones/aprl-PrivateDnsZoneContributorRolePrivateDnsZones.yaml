title: Protect private DNS zones and records
description: Private DNS zones and records are critical and their deletion can cause service outages.
  To protect against unauthorized or accidental changes, the Private DNS Zone Contributor role, a built-in
  role for managing these resources, should be assigned to specific users or groups.
