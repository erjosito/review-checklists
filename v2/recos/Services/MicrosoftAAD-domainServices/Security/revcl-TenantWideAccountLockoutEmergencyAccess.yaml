description: Use nonfederated, nonsynchronized onmicrosoft.com accounts with permanent active Global Administrator
  assignments. Register phishing-resistant authentication with dependencies independent of routine administration,
  store credentials securely in separate locations, and use a designated secure workstation. Exclude the
  accounts from Conditional Access policies that block or restrict sign-in, but do not bypass strong authentication.
  Alert on every use, investigate activity, prevent credential expiration or automated cleanup, and validate
  sign-in and administrative recovery at least every 90 days.
