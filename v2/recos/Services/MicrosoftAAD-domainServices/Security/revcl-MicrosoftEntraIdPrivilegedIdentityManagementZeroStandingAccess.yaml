description: Use eligible, least-privilege role assignments and controlled activation for routine privileged
  administration. Regularly review assignments and remove access that is no longer required. Keep designated
  emergency Global Administrator accounts permanent active rather than eligible so that recovery does
  not depend on role activation or available approvers. Protect, monitor and exercise emergency access
  separately.
