description: Define Conditional Access policies based on identity, risk and device requirements, and test
  their effect before enforcement. Exclude documented emergency access accounts from policies that block
  or restrict sign-in, as required by the emergency-access design; report-only policies do not require
  an exclusion. Protect those accounts with independent phishing-resistant authentication, monitoring
  and regular drills. Do not interpret an exclusion as permission to use password-only emergency access.
