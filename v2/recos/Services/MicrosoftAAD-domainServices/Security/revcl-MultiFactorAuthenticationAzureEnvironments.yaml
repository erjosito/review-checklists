description: Prefer phishing-resistant authentication for privileged access. Emergency accounts also need
  strong authentication, such as FIDO2 passkeys or certificate-based authentication, using dependencies
  different from routine administrators. Conditional Access exclusions for recovery do not remove mandatory
  MFA requirements. Verify effective authentication and recovery paths through identity evidence and controlled
  drills.
