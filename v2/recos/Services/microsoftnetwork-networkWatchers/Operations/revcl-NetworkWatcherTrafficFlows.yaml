description: Use Network Watcher flow telemetry to investigate expected and unexpected traffic. New NSG
  flow-log creation is no longer supported; migrate existing NSG flow logs to virtual network flow logs
  before September 30, 2027. Validate storage, retention, traffic analytics and downstream investigations
  after migration. Existing storage records are not deleted by the NSG flow-log resource retirement. Flow-log
  configuration alone is not proof of complete traffic visibility.
