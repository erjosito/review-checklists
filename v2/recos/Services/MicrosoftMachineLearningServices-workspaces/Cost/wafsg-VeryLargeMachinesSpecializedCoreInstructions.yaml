name: wafsg-VeryLargeMachinesSpecializedCoreInstructions
title: Benchmark Azure Machine Learning compute families against training requirements
description: Choose CPU, GPU, memory and other compute capabilities from the training workload rather
  than family names alone. Benchmark suitable sizes against completion time, resource utilization and
  total run cost. Repeat the comparison as data or models change; both oversized resources and undersized,
  slow-running resources can increase cost.
