name: aprl-ZoneRedundancyPremiumTier
title: Enable zone redundancy for SignalR
description: Use SignalR with zone redundancy for production to improve uptime. This feature, available
  in the Premium tier, is activated upon creating or upgrading to Premium. Standard can upgrade to Premium
  without downtime.
