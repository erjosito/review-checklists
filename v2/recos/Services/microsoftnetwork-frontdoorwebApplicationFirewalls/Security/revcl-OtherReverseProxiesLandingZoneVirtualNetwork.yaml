description: Where inbound HTTP/S protection requires an application-owned regional WAF or partner reverse
  proxy, place the deployment in the application landing-zone virtual network with the workloads it protects.
  Application Gateway and partner NVAs are applicable examples. This placement recommendation is not a
  requirement to deploy the global Azure Front Door edge service inside a VNet. Because the partner proxy's
  deployment technology is unspecified, do not constrain applicability to a guessed VM, scale set or policy
  ARM type.
