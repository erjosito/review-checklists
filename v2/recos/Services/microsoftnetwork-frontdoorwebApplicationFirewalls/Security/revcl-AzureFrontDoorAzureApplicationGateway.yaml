description: 'When Application Gateway is an origin behind Front Door, apply the intended WAF policy at
  Front Door and prevent direct public traffic from bypassing that path. For a public Application Gateway
  origin, combine network filtering using AzureFrontDoor.Backend with validation of the expected X-Azure-FDID
  value; the shared service tag alone does not identify your Front Door instance. Review the actual Front
  Door tier and applicable policy capabilities: Standard supports custom rules, Premium supports managed
  rules, and existing classic deployments require their own configuration and migration planning. Private
  Link is a Premium-specific option for supported origins, not a universal prerequisite.'
