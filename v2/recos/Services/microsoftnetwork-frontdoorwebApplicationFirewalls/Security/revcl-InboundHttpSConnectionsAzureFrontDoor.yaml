description: 'Use Front Door with WAF policies for the intended global HTTP/S ingress protection requirement.
  Front Door WAF runs at the global edge; it is not deployed inside the landing-zone virtual network.
  Review policy association and capabilities against the actual tier: Standard has custom rules while
  Premium supports managed rule sets. Microsoft.Cdn/profiles is in scope only for Azure Front Door Standard/Premium
  SKUs; existing Microsoft.Network/frontdoors classic resources remain a distinct deployment model. The
  shared Front Door WAF policy type does not by itself identify the tier.'
