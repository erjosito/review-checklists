description: 'For WAF-enabled Azure Front Door and Application Gateway deployments, enable the appropriate
  resource diagnostic categories, send them to the Log Analytics workspace used by Microsoft Sentinel,
  and configure the Azure WAF solution/connector and required analytics. Review ingestion and detection
  coverage rather than assuming that forwarding logs alone provides complete attack detection. Diagnostics
  belong to the application delivery resource: Front Door Standard/Premium uses Microsoft.Cdn/profiles
  with an Azure Front Door SKU, classic uses Microsoft.Network/frontdoors, and Application Gateway uses
  Microsoft.Network/applicationGateways. Other CDN profile SKUs are not implicitly in scope.'
