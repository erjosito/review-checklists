description: For WAF-enabled Front Door and Application Gateway deployments, configure diagnostic settings
  on the application delivery resource to retain the appropriate WAF logs and regularly review them for
  attacks and false positives. WAF logging is not established merely by the existence of a policy. Front
  Door Standard/Premium diagnostics use Azure Front Door SKU Microsoft.Cdn/profiles resources; classic
  diagnostics use Microsoft.Network/frontdoors. Application Gateway diagnostics use Microsoft.Network/applicationGateways.
  Select the categories available for the actual service/tier and do not include unrelated CDN profiles
  solely because their ARM type matches.
