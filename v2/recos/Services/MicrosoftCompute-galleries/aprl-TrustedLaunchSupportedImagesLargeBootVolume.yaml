name: aprl-TrustedLaunchSupportedImagesLargeBootVolume
title: Consider creating TrustedLaunchSupported images where possible
description: We recommend creating Trusted Launch Supported Images for benefits like Secure Boot, vTPM,
  trusted launch VMs, large boot volume. These are Gen 2 Images by default and you cannot change a VM's
  generation after creation, so review the considerations first.
source:
