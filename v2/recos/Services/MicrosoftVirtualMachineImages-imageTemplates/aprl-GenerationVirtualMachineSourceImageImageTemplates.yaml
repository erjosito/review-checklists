name: aprl-GenerationVirtualMachineSourceImageImageTemplates
title: Use Generation 2 virtual machine source image
description: When building Image Templates, use sources for gen 2 VMs. Gen 2 offers more memory, supports
  >2TB disks, uses UEFI for faster boot/installation, has Intel SGX, and virtualized persistent memory
  (vPMEM), unlike gen 1's BIOS-based architecture.
