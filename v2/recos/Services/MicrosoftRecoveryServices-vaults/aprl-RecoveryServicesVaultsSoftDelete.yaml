name: aprl-RecoveryServicesVaultsSoftDelete
title: Verify Backup soft-delete protection and recovery retention
description: Keep soft-delete protection for Recovery Services vault backup data and verify recovery procedures.
  The default soft-delete retention is 14 days and can be configured from 14 to 180 days; retention beyond
  14 days incurs additional charges. Account for secure-by-default enforcement rather than assuming soft
  delete can always be disabled. Confirm workload and region applicability, because vaulted data protection
  does not imply identical protection for every operational backup type.
