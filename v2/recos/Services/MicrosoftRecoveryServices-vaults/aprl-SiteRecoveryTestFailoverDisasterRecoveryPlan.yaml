name: aprl-SiteRecoveryTestFailoverDisasterRecoveryPlan
title: Validate VM functionality with a Site Recovery test failover to check performance at target
description: Perform a test failover to validate your BCDR strategy and ensure that your applications
  are functioning correctly in the target region without impacting your production environment. Test your
  Disaster Recovery plan periodically without any data loss or downtime, using test failovers.
