name: revcl-PotentialRansomwareEncryptionRansomwareAttacks
title: Verify Azure Backup soft-delete retention and recovery support for the vault and workload
description: Keep soft-delete protection in place and choose a retention period from 14 to 180 days based
  on recovery needs. The default is 14 days; longer retention can incur charges. Verify current secure-by-default
  rollout and API behavior for the vault type and region instead of assuming every deployment has identical
  enforcement. Operational backups and log recovery points have documented exclusions; directly accessible
  operational snapshots can still be deleted. Recovering a soft-deleted backup item returns it to stopped
  protection with retained data; explicitly restore data or resume backups as needed.
