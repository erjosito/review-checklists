name: aprl-SiteRecoveryVmFailoverSettingsVmNetworkSettings
title: Ensure static IP addresses in Site Recovery VM failover settings are available in failover subnet
description: Ensure VM failover settings' static IP addresses are available in the failover subnet to
  maintain consistent IP assignment during failover, with the target VM receiving the same static IP if
  it's available or the next available IP otherwise. IP adjustments can be made in VM Network settings.
