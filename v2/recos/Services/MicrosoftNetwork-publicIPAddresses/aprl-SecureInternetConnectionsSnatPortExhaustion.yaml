name: aprl-SecureInternetConnectionsSnatPortExhaustion
title: Use NAT gateway for outbound connectivity to avoid SNAT Exhaustion
description: Prevent connectivity failures due to SNAT port exhaustion by employing NAT gateway for outbound
  traffic from virtual networks, ensuring dynamic scaling and secure internet connections.
