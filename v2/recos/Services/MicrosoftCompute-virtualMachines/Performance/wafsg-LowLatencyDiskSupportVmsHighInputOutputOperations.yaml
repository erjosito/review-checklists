name: wafsg-LowLatencyDiskSupportVmsHighInputOutputOperations
title: Select VM storage from measured IOPS, throughput, latency and durability needs
description: Match the VM and disk performance profiles to the workload; consider Premium SSD v2 where
  its supported capabilities fit. Benchmark both VM-level and disk-level constraints. Locally attached
  NVMe is temporary storage and must not be the only copy of durable application data. Avoid treating
  one disk tier as mandatory for every production VM.
