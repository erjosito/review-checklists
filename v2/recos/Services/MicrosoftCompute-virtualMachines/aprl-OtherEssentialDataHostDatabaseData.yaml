name: aprl-OtherEssentialDataHostDatabaseData
title: Host database data on a data disk
description: A data disk is a managed disk attached to a virtual machine for storing database or other
  essential data. These disks are SCSI drives labeled as per choice.
source:
  type: aprl
  file: azure-resources/Compute/virtualMachines/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
