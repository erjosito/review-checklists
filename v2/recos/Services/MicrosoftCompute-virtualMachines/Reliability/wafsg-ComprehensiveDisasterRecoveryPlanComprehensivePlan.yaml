name: wafsg-ComprehensiveDisasterRecoveryPlanComprehensivePlan
title: Maintain and exercise a documented disaster recovery plan for VM-based workloads
description: Document activation criteria, accountable operators, communication paths, recovery sequencing,
  data protection, network and identity prerequisites, and a separate failback procedure. Include VMs
  and their dependencies, not only replication settings. Keep plans and recovery assets accessible during
  outages. Test safe non-production recovery first, then use appropriately authorized realistic drills
  to measure component and end-to-end RTO/RPO and update the plan from results. Configuration inventory
  alone cannot prove recovery readiness.
