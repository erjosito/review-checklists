name: wafsg-CompositeServiceLevelObjectivesAzureServiceLevelAgreements
title: Define business-driven reliability and recovery targets for VM-based workload flows
description: Agree measurable availability SLOs, their SLIs and measurement windows, and RTO/RPO targets
  with business stakeholders. Account for VM, storage, network and external dependencies, deployment and
  operational failure modes. Azure SLAs are contractual inputs, not observed workload availability and
  not an automatic ceiling on a workload SLO. Use the targets to guide architecture and health modeling,
  and refine them with monitoring and recovery-test evidence.
