name: aprl-ProductionVmWorkloadsVmssFlexInstance
title: Run production workloads on two or more VMs using VMSS Flex
description: Production VM workloads should be deployed on multiple VMs and grouped in a VMSS Flex instance
  to intelligently distribute across the platform, minimizing the impact of platform faults and updates.
