queries:
  arg: |
    // Azure Resource Graph Query
    // Find all VMs that are not associated with a VMSS Flex instance
    resources
    | where type =~ 'Microsoft.Compute/virtualMachines'
    | where isnull(properties.virtualMachineScaleSet.id)
