name: aprl-DifferentFaultDomainsAvailabilitySets
title: Migrate VMs using availability sets to VMSS Flex
description: While availability sets are not scheduled for immediate deprecation, they are planned to
  be deprecated in the future. Migrate workloads from VMs to VMSS Flex for deployment across zones or
  within the same zone across different fault domains (FDs) and update domains (UDs) for better reliability.
