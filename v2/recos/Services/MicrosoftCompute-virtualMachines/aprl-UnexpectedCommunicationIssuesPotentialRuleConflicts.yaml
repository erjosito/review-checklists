name: aprl-UnexpectedCommunicationIssuesPotentialRuleConflicts
title: Apply NSG policy at subnet or NIC scope and review combined rules
description: Associate network security groups at the subnet and/or network-interface scope according
  to the required traffic policy. An NSG is not universally required at both scopes. When both are configured,
  traffic must be allowed by both applicable rule sets; inbound processing evaluates the subnet rules
  before the NIC rules. Review the combined effective rules and required application flows rather than
  assuming that dual association alone proves compliance.
