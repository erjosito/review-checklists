name: aprl-ManagedDisksVmDisks
title: Migrate any remaining unmanaged VM disks to managed disks
description: Azure unmanaged disks were fully retired on March 31, 2026, an extension of the earlier September
  30, 2025 date. IaaS VMs using unmanaged disks cannot be started after retirement. Identify remaining
  affected VMs and migrate to managed disks immediately, following the documented migration and recovery
  process. The old future-tense September 2025 deadline is no longer current.
