name: aprl-AzureVmDisksAzureDiskEncryption
title: Protect VM disks and verify encryption-at-host eligibility
description: Use Azure Disk Encryption or encryption at host only where supported by the VM and disk configuration.
  Encryption at host also protects temporary disks, ephemeral OS disks, and OS/data disk caches. Verify
  supported VM sizes and subscription prerequisites. Do not enable encryption at host on VMs that currently
  or previously used Azure Disk Encryption, and do not combine both mechanisms. Existing VMs require deallocation
  and reallocation when enabling encryption at host; plan the supported migration and outage rather than
  treating the settings as interchangeable switches.
