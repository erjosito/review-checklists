name: aprl-HigherSingleInstanceVirtualMachineUptimeSlasHighestUptimeSla
title: Mission Critical Workloads should consider using Premium or Ultra Disks
description: Compared to Standard HDD and SSD, Premium SSD, SSD v2, and Ultra Disks offer improved performance,
  configurability, and higher single-instance VM uptime SLAs. The lowest SLA of all disks on a VM applies,
  so it is best to use Premium or Ultra Disks for the highest uptime SLA.
source:
