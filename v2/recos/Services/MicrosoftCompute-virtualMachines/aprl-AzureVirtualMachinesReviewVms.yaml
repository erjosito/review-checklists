name: aprl-AzureVirtualMachinesReviewVms
title: Review VMs in stopped state
description: Azure Virtual Machines (VM) instances have various states, like provisioning and power states.
  A non-running VM may indicate issues or it being unnecessary, suggesting removal could help cut costs.
source:
  type: aprl
  file: azure-resources/Compute/virtualMachines/recommendations.yaml
  timestamp: July 24, 2024
resourceTypes:
- microsoft.compute/virtualmachines
severity: 2
