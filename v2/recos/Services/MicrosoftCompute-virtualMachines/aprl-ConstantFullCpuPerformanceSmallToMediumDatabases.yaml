name: aprl-ConstantFullCpuPerformanceSmallToMediumDatabases
title: Don't use A or B-Series VMs for production needing constant full CPU performance
description: A-series VMs are tailored for entry-level workloads like development and testing, including
  use cases such as development and test servers, low traffic web servers, and small to medium databases.
