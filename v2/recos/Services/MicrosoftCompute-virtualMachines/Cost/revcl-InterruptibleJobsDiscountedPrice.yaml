description: Evaluate Spot for interruption-tolerant work using regional/SKU price and eviction history.
  Azure can reclaim capacity, and Spot VMs have no availability SLA. Set an appropriate maximum price
  and eviction policy, checkpoint or retry work, and account for retained-disk charges after deallocation.
  Capacity availability and a maximum-price ceiling are not an auction or a restart guarantee.
