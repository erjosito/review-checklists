description: Review Advisor VM/VMSS recommendations with representative CPU, memory, network, disk and
  application telemetry, peak periods and growth forecasts. Test the proposed SKU against latency, throughput
  and recovery requirements. Recalculate net costs against current reservations, savings plans and negotiated
  rates before rollout; document justified exceptions.
