    accessedAt: '2026-09-11'
description: Choose an Advisor lookback that represents workload cycles and review recommendation freshness
  after configuration changes. Distinguish display filters from generation criteria. Check shutdown and
  resize recommendations against seasonality, memory and I/O requirements, standby capacity and purchased
  commitments rather than accepting estimated savings blindly.
