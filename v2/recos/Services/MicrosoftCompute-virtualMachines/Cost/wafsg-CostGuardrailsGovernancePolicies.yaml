name: wafsg-CostGuardrailsGovernancePolicies
title: Enforce spending guardrails in policies and deployment reviews
description: Define allowed resource types, SKUs, regions, scale limits and allocation metadata with exception
  ownership. Apply least-privilege provisioning and cost-estimate approval gates before expensive changes.
  Use monitoring and budget alerts as complementary detective controls, not substitutes for preventive
  limits or proof that spend cannot exceed budget.
