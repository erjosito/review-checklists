description: Compare Standard SSD, Premium SSD and eligible alternatives using IOPS, throughput, latency,
  capacity and transaction/bursting charges. Include Premium SSD v2 where independent performance provisioning
  is suitable. Test lower-cost tiers under peak workload and preserve availability/recovery requirements;
  nonproduction does not automatically imply Standard SSD.
