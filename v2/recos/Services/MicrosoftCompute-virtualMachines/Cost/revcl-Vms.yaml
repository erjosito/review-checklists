  - url: https://learn.microsoft.com/cloud-computing/finops/best-practices/general
    title: FinOps best practices for general resource management
    accessedAt: '2026-09-11'
  upstreamRecommendations:
  - sourceId: advisor-cost-catalog
    recommendationId: e10b1381-5f0a-47ff-8c7b-37bd13d7c974
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-reference-cost-recommendations
    coverage: full
    assessedAt: '2026-09-11'
    upstreamContentHash: sha256:dfb8eb246d5d3a67d34ce36b928bec6b45b7c0a50e5d4b4679ab50c3904036cd
    notes: The refreshed control explicitly reviews low-use VM resizing or shutdown with utilization and
      intentional-standby exceptions, matching the published opportunity rather than relying on the query
      filter alone. Source-text assessment, not independent human approval or live Azure validation.
description: Use Advisor rightsizing opportunities as review candidates. Compare CPU, memory, I/O, peaks,
  availability and application requirements before changing VM size or shutting down capacity. Recalculate
  costs with commitments and dependencies, test changes and record justified standby or growth exceptions.
