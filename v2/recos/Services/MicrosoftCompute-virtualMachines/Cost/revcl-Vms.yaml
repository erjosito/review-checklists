name: revcl-Vms
title: Review VM rightsizing with utilization evidence and workload constraints
source:
  type: revcl
  file: ./checklists/waf_checklist.en.json
resourceTypes:
- microsoft.compute/virtualmachines
waf: Cost
severity: 1
labels:
  guid: 544451e1-92d3-4442-a3c7-628637a551c5
links:
- type: docs
  url: https://learn.microsoft.com/azure/load-balancer/load-balancer-overview
queries:
  arg: |-
    AdvisorResources
    | where type =~ 'microsoft.advisor/recommendations'
    | where properties.category =~ 'Cost'
    | where tostring(properties.recommendationTypeId) in~ ('e10b1381-5f0a-47ff-8c7b-37bd13d7c974')
    | project id, subscriptionId, resourceGroup,
        targetResourceId = tostring(properties.resourceMetadata.resourceId),
        impactedField = tostring(properties.impactedField),
        recommendationTypeId = tostring(properties.recommendationTypeId),
        impact = tostring(properties.impact),
        problem = tostring(properties.shortDescription.problem),
        solution = tostring(properties.shortDescription.solution),
        lastUpdated = tostring(properties.lastUpdated),
        extendedProperties = properties.extendedProperties
schemaVersion: 1
id: 544451e1-92d3-4442-a3c7-628637a551c5
services: []
automation:
  status: query_available
  resultSemantics: inventory
  validatedAt: null
  notes: Unexecuted Advisor opportunity inventory, not compliance or realized savings. id identifies the
    Advisor recommendation; targetResourceId identifies the affected resource. Use the intended subscriptions
    or management-group scope with complete read permissions and paging. Empty or truncated results do
    not establish compliance. Advisor coverage, telemetry and freshness vary; review dismissals, dependency/retention
    requirements, actual billing and existing commitments before action. Do not sum overlapping estimates
    or assume a common currency/time horizon in extendedProperties. No live Azure execution or compilation;
    validatedAt remains null. Only this primary query is wired.
provenance:
  upstreamRevision: null
