description: After a resize, shutdown or migration, measure reservation and savings-plan utilization and
  uncovered eligible usage using billing and usage data. Reassign benefits or use currently permitted
  exchange/trade-in options before new purchases. Separate unused commitment cost from resource consumption
  and assign an owner to investigate underutilization.
