description: Evaluate Azure Hybrid Benefit and commitment discounts as separate components of the total
  VM bill. Confirm license eligibility, commitment coverage and utilization, then compare the resulting
  effective cost with the applicable on-demand baseline. Include residual software and dependent-resource
  charges instead of applying a universal discount percentage.
