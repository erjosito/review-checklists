description: Find unattached disks, identify their owner and detachment context, and exclude active transfer,
  Site Recovery and approved recovery/retention uses. Delete or retier only after data-retention, recovery
  and change approval. Evaluate continuing snapshot/backup costs and never treat an unattached state as
  permission to erase data.
