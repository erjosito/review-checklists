description: 'Evaluate one-year reservations for currently eligible Premium SSD SKUs P30 through P80,
  subject to region and offer availability. Reservations apply per matching disk SKU, not a fungible pool
  of GiB: one P40 reservation does not cover two P30 disks. Premium SSD v2, Ultra, Standard SSD/HDD and
  smaller Premium SKUs are excluded by the current guidance. Right-size first and monitor unused reservation
  hours.'
