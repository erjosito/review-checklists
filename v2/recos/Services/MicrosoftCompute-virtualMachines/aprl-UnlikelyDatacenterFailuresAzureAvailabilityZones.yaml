name: aprl-UnlikelyDatacenterFailuresAzureAvailabilityZones
title: Deploy VMs across Availability Zones
description: Azure Availability Zones, within each Azure region, are tolerant to local failures, protecting
  applications and data against unlikely Datacenter failures by being physically separate.
