description: Assign workload and SecOps contacts, incident command and decision authority. Document detection
  and triage, containment, evidence preservation, eradication, secure recovery and communication obligations.
  Exercise scenarios from localized compromise through disaster recovery, including failover and failback
  without reintroducing the compromise. Retain incident records, run post-incident reviews, and feed lessons
  into the playbook and future drills. Use business-approved recovery tradeoffs and test the procedures
  in a low-risk environment.
