description: Verify identities explicitly, grant least-privilege access for the required duration, and
  assume a component or identity can be compromised. Assess inbound and outbound access, control and data
  planes, workload identities and privileged users. Record owners for nonidentity access, compensating
  controls and reviewable exceptions. Configuration inventories alone cannot establish that these controls
  are effective.
