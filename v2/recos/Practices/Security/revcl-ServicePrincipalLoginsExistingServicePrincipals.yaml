description: Use managed identities for supported Azure service-to-service access and grant only the required
  data-plane permissions. A managed identity is represented by a service principal; the security benefit
  is avoiding application-managed credentials, not eliminating service principals. Where managed identities
  are unsuitable, evaluate federated workload identities and protect any remaining credentials with a
  managed secret store, rotation and access auditing. Review identity use and permissions, not only the
  existence of an identity object.
