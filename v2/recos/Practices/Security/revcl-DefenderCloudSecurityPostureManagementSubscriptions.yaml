description: Use free Foundational CSPM for baseline posture assessment and evaluate paid Defender CSPM
  for capabilities such as attack-path analysis and risk prioritization. Confirm plan applicability and
  cost before enabling paid features. Microsoft announces that new Azure subscriptions must opt in to
  Foundational CSPM starting October 27, 2026; already-enabled subscriptions remain enabled. Track recommendation
  ownership, remediation and accepted exceptions rather than treating a score or empty findings list as
  proof of security.
