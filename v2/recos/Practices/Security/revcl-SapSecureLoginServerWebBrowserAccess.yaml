name: revcl-SapSecureLoginServerWebBrowserAccess
title: For SSO for SAP GUI and web browser access, implement SNC / Kerberos/SPNEGO (simple and protected
  GSSAPI negotiation mechanism) due to its ease of configuration and maintenance. For SSO with X.509 client
  certificates, consider the SAP Secure Login Server, which is a component of the SAP SSO solution.
