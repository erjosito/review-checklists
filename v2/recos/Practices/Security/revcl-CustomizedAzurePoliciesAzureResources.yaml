description: Choose CanNotDelete or ReadOnly according to the operations that must remain available, and
  test deployment, scaling and recovery workflows before applying inherited locks. Locks are control-plane
  safeguards, not an authorization boundary or a way to prevent data-plane reads, changes or deletion.
  Limit permission to remove locks and use service-level retention, backup and access controls for the
  underlying data.
