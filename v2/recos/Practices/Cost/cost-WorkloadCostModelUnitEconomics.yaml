title: Maintain a workload cost model tied to business units and reliability targets
description: Model initial, run-rate and ongoing cost for compute, data, network, licensing, security,
  observability, support and engineering operations. Include resilience/recovery and growth scenarios.
  Track meaningful unit costs such as cost per transaction or customer, agree a budget buffer and update
  the model when architecture, price or demand changes.
