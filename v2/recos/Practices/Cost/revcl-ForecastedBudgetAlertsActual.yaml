description: Set scoped budgets and actual/forecast thresholds that reflect workload forecasts and billing
  currency. Assign owners and an escalation process, check recipients and alert delivery, and review scope/offer
  support and data latency. Budgets notify; they do not cap charges or automatically stop resources. Any
  automated response needs separate approval and safeguards.
