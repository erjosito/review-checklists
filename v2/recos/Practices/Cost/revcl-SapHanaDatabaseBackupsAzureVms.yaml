description: Review whether supported differential or incremental backups can replace unnecessarily frequent
  full backups while meeting RPO, RTO and retention requirements. Test the complete restore chain and
  account for storage, transfer and operational cost. Treat Advisor backup recommendations as candidates
  requiring database-owner approval.
