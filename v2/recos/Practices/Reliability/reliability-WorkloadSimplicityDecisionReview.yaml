name: reliability-WorkloadSimplicityDecisionReview
title: Justify workload complexity against business reliability requirements
description: 'Review the workload with business and technical stakeholders and justify components, dependencies
  and design patterns against functional and nonfunctional requirements. Remove unnecessary coupling,
  custom code and operational overhead; prefer supported platform capabilities and reusable libraries
  when they meet those requirements. Record the tradeoffs: a simpler design must still satisfy critical-flow
  availability, recovery, scale and data-consistency needs. Revisit the decisions as the workload evolves.
  Architecture and code review are required; resource inventory cannot establish this control.'
