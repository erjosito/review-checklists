name: performance-OperationalTaskBudgets
title: Budget and measure the performance impact of routine operational tasks
description: Inventory deployments, patching, security scans, secret/certificate rotation, backups and
  database maintenance that share workload resources. Include their overhead in performance budgets and
  test overlap with user traffic. Schedule or throttle work where possible, prewarm deployment capacity
  and preserve required security and recovery controls. Keep current serving capacity during rollout,
  define rollback and compare latency/throughput before and after changes. Record the measurement and
  owner; configuration inventory cannot establish the operational performance impact.
