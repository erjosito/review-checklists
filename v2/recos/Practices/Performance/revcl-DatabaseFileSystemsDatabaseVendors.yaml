description: Measure scanning overhead and use the database vendor's current, narrowly scoped exclusion
  guidance for the deployed product and version. Do not blanket-exclude every database filesystem and
  executable. Coordinate exclusions with security owners and retain required protection. Exact SAP/Oracle
  exclusion paths and licensing-specific tools require vendor review.
