name: performance-FlowPerformanceTargets
title: Define numerical performance targets for every workload flow
description: Inventory user, system and data flows and their dependencies. Agree workload-driven numerical
  latency percentiles, throughput, concurrency and error targets, with a measurement window and owner
  for each applicable flow. Derive component budgets from end-to-end requirements and publish the targets
  for development and operations. Review customer feedback and revise targets when requirements change.
  Do not copy example thresholds or infer achievement from Azure configuration inventory.
