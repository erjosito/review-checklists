name: performance-PerformanceIncidentTriage
title: Maintain and exercise a live performance incident response plan
description: Assign detection, triage, escalation and stakeholder communication responsibilities for live
  latency, throughput and resource-contention incidents. Keep architecture/dependency information, baseline-aligned
  alerts and time-limited least-privilege access to diagnostic evidence ready. Correlate metrics, traces,
  logs and changes to test root-cause hypotheses; apply an approved mitigation or rollback and verify
  recovery against performance targets. Record lessons, preventive actions, owners and runbook improvements
  to shorten recurrence recovery. This complements security incident response and is not proven by inventory
  or an alert count.
