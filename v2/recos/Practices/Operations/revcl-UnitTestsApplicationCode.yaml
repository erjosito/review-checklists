description: Include fast unit tests for application code and validation tests for IaC in the build process.
  Add integration and end-to-end tests that verify the application can use the provisioned infrastructure
  and critical business flows still work. Define test scope and release entry/exit criteria based on workload
  risk. Keep feedback fast without using unit-test success as a substitute for deployment and recovery
  testing.
