    notes: Clarify emergency change authorization and follow-up instead of treating all quick fixes as
      acceptable debt. Narrow control or service scope; not all aspects of the upstream control.
    url: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments
