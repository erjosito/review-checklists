description: Implement emergency fixes through the defined deployment process. Document who may approve
  accelerated gates and under which conditions, retain the tests and health checks that can run safely,
  and complete deferred checks promptly. Record the change, owner and follow-up work in the backlog; review
  incidents without blame and reconcile any temporary configuration with version-controlled code.
