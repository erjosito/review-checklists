description: Use declarative, version-controlled Bicep, ARM templates or Terraform for platform and workload
  landing-zone resources. Standardize modules, parameters, style and tested tool/API versions; promote
  the same assets across environments through reviewed pipelines. Test deployment, configuration changes
  and recovery, document unavoidable manual steps and reconcile drift. Inspect repositories and pipeline
  evidence rather than inferring IaC use from resource names.
