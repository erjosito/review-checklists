    notes: Make landing-zone IaC repeatability and change control explicit without claiming deployed configuration
      proves process quality. Narrow control or service scope; not all aspects of the upstream control.
    url: https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/infrastructure-as-code-design
