description: Use Azure Policy definitions, initiatives and assignments to evaluate and enforce organizational
  resource standards and report noncompliance. Combine this with Azure RBAC for authorization. Review
  assignment scope, exclusions, exemptions, effects and remediation permissions. Evaluation occurs at
  documented lifecycle triggers and periodic cycles, not as a guarantee of immediate detection. Test policies
  before broad enforcement.
