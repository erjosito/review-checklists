description: Deploy version-controlled IaC through predictable CI/CD pipelines. Promote the same tested
  artifacts across environments, with explicit parameters for intended differences. Require code review,
  configuration/security checks, integration tests and release gates. Use small changes, staged exposure,
  health checks and sufficient observation time; halt on degraded health and exercise rollback or roll-forward,
  including stateful changes. Define emergency approval and follow-up rules rather than bypassing the
  supply chain. Verify pipeline definitions and run evidence manually.
