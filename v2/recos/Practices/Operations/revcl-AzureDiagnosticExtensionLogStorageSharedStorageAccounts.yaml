description: Inventory Windows and Linux Azure Diagnostics extensions and their data destinations. Migrate
  retired WAD/LAD collection to supported alternatives such as Azure Monitor Agent and data collection
  rules, using the destination-specific migration guidance. Validate expected logs, counters, alert dependencies
  and retention before removing the old extension, and prevent duplicate ingestion. Boot diagnostics is
  a separate native VM feature and does not require WAD/LAD.
