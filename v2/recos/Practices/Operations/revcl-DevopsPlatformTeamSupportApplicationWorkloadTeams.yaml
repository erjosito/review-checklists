description: Agree the workload and platform teams' responsibilities, support boundaries and escalation
  paths. Provide documented self-service workflows and reusable platform standards, with least-privilege
  Azure RBAC appropriate to each task; use custom roles only when built-in roles do not meet the requirement.
  Verify onboarding and support exercises rather than equating a custom role with operational independence.
