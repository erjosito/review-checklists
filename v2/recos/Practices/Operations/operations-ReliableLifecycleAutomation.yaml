name: operations-ReliableLifecycleAutomation
title: Govern operational automation for reliability, security and maintainability
description: Prioritize repetitive, procedural workload tasks with demonstrable operational value. Select
  maintainable, supported tools and keep automation in source control. Apply workload-equivalent access
  controls, testing, monitoring and ownership to automated operations; define error handling, stop/recovery
  behavior and human decision points. Measure outcomes and maintenance effort, investigate bypasses, and
  revisit automation as the workload changes. Assess scripts, pipelines, run history and operator procedures
  manually; deployed automation resources alone do not prove reliability or return on investment.
