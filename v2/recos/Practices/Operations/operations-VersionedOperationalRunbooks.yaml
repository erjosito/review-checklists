name: operations-VersionedOperationalRunbooks
title: Maintain and exercise versioned operational runbooks
description: Standardize routine, ad-hoc and emergency operations with actionable, version-controlled
  procedures. Define owners, prerequisites, permissions, steps, expected results, stop conditions, escalation
  and recovery. Minimize and document manual steps, use shared organizational standards, and record approved
  emergency deviations. Review procedures on a schedule and after changes or incidents, and rehearse representative
  operations with the people who will perform them. Retain review and exercise evidence; an Azure Automation
  account, script or resource inventory cannot prove runbook quality or operational readiness.
