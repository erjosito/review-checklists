description: Choose telemetry destinations according to query needs, data residency, access controls,
  retention and operational requirements. Centralize or retain regional data deliberately, minimize unnecessary
  duplication and transfer, and filter sensitive fields. When an on-premises SIEM requires raw events,
  use a supported secured export path and validate delivery, latency and completeness; alerts alone might
  not provide enough forensic context.
