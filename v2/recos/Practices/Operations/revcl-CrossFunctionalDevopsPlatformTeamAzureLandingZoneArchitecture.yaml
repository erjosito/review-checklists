description: Establish a cross-functional team with shared end-to-end responsibility for building and
  operating the landing zone. Define roles, decision authority, collaboration with workload teams and
  escalation. Reserve time for learning and safe experimentation, and use blameless reviews to turn operational
  findings into owned improvements. Team names and permissions are not evidence that these practices are
  followed.
