description: Define workload health indicators and business KPIs, then map application and infrastructure
  logs, metrics, traces and platform events to them. Use correlation IDs to follow critical user flows.
  Define actionable alerts with owners, escalation paths and tested thresholds. Review telemetry gaps,
  retention, sensitive-data filtering and monitoring-pipeline health as the workload changes. Review dashboards,
  sample traces and alert exercises; resource configuration alone does not establish observability quality.
