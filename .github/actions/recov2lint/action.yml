# action.yml
name: 'Validate PRs for v2 recommendations and checklists.'
description: 'Verify that no duplicate names exist and that all YAML files conform to the schemas.'
inputs:
  folder:
    description: 'Folder where the recommendations are stored'
    required: false
    default: './v2'
  verbose:
    description: 'Verbose output, true/false (string)'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install validation dependencies
      shell: bash
      run: python -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"
    - name: Validate source corpus and checklists
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CORPUS_ROOT: ${{ inputs.folder }}
      run: python -m scripts.validate_corpus --root "$CORPUS_ROOT"
