name: Deprecated manual APRL import
on:
    workflow_dispatch:
jobs:
  get-aprl:
    runs-on: ubuntu-latest
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    - name: Manual fallback notice
      run: echo "::warning::Deprecated manual importer. Imported or LLM-curated recommendations require schema validation and human review before merging."
    # Get the APRL checklist
    - name: Retrieve the APRL checklists
      uses: ./.github/actions/get_aprl
      with:
        output_file: './checklists-ext/aprl_checklist.en.json'
        verbose: 'true'
    # Create a PR
    - name: Create pull request
      uses: peter-evans/create-pull-request@v6
      with:
        title: 'Latest version of the APRL checklists retrieved'
        labels: 'automated'
        body: 'This PR is to retrieve the latest version of the APRL checklists.'
        token: ${{ secrets.WORKFLOW_PAT }}
